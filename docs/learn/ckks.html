<script>
(function(){
"use strict";
const {svg,tile,lock,lbl,small,A,pop,fade,draw,slide,countUp,f,fe,sup,big}=LS;
const reduce=LS.reduce, ease="cubic-bezier(.2,.7,.2,1)", $=LS.$, hex=(v,m)=>LS.hex(v,m,5), polyStr=LS.poly.str;
const C=CKKS.make({N:4,deltaBits:20,q0Bits:30,levels:3,pBits:100}), q=C.q, D=C.D;
const W=LS.W, B=LS.B, C0=0.09375, C1=0.5, C2=0.46875;
const frac=(v,m)=>Number((((v%m)+m)%m)*1000n/m)/1000;
let R;
function compute(inp){
  const x=[inp.x1,inp.x2];
  const prod=[x[0]*W[0],x[1]*W[1]], dot=prod[0]+prod[1], z=dot+B, relu=Math.max(0,z), poly=C0+C1*z+C2*z*z;
  const m=C.encode(x), ct=C.encrypt(m), dm=C.decRaw(ct);
  const c4a=C.mulPt(ct,C.encode(W)), c4=C.rescale(c4a), c5r=C.rotate(c4,1), c5=C.add(c4,c5r), cz=C.addPt(c5,C.encode([B,B]));
  const zz=C.rescale(C.mulCt(cz,cz)), t=C.rescale(C.mulPt(zz,C.cst(C2))), u=C.down(C.rescale(C.mulPt(cz,C.cst(C1)))), y=C.addPt(C.add(t,u),C.cst(C0));
  const V=c=>C.val(c), yv=V(y)[0];
  R={x,prod,dot,z,relu,poly,s:C.K.s,m,back:C.decode(m),ct,dm,e:dm.map((v,i)=>v-m[i]),
     bars0:ct.c[0].map(v=>frac(v,q[3])), bars1:ct.c[1].map(v=>frac(v,q[3])),
     v4a:C.val(c4a,D*D), v4:V(c4), vr:V(c5r), v5:V(c5), vz:V(cz), vzz:V(zz)[0], vt:V(t)[0], vu:V(u)[0], vy:yv,
     err:{enc:Math.abs(C.decode(dm)[0]-x[0]), w:Math.max(Math.abs(V(c4)[0]-prod[0]),Math.abs(V(c4)[1]-prod[1])), z:Math.abs(V(cz)[0]-z), y:Math.abs(yv-poly)}};
  return R;
}
const steps=[
{ key:"Example", who:"both", whoT:"the task", at:0, lv:4, scale:"—", err:()=>0,
  title:"One neuron of an LLM",
  cap:()=>`The client owns x, the server owns w and b. Together they must compute y = ReLU(w·x + b) = <b>${f(R.relu,2)}</b> while the server stays blind.`,
  scene(){ const xs=R.x.map(v=>+v.toFixed(3));
    return svg(380,`
      <g class="c-client"><rect x="20" y="20" width="200" height="340" rx="10" fill="currentColor" fill-opacity=".06" stroke="currentColor" stroke-dasharray="5 5"/>${lbl(40,48,"CLIENT","font-weight=\"700\"")}</g>
      <g class="c-server"><rect x="250" y="20" width="400" height="340" rx="10" fill="currentColor" fill-opacity=".06" stroke="currentColor" stroke-dasharray="5 5"/>${lbl(270,48,"SERVER","font-weight=\"700\"")}</g>
      <g class="c-client"><rect x="670" y="20" width="110" height="340" rx="10" fill="currentColor" fill-opacity=".06" stroke="currentColor" stroke-dasharray="5 5"/>${lbl(690,48,"CLIENT","font-weight=\"700\"")}</g>
      <g class="c-server">
        <path class="edge" pathLength="1" stroke-dasharray="1" d="M150,130 C260,130 300,190 410,190" fill="none" stroke="currentColor" stroke-width="3"/>
        <path class="edge" pathLength="1" stroke-dasharray="1" d="M150,270 C260,270 300,190 410,190" fill="none" stroke="currentColor" stroke-width="3"/>
        <path class="edge" pathLength="1" stroke-dasharray="1" d="M450,190 L530,190" fill="none" stroke="currentColor" stroke-width="3"/>
        <path class="edge" pathLength="1" stroke-dasharray="1" d="M620,190 L686,190" fill="none" stroke="currentColor" stroke-width="3" marker-end="url(#ahs)"/>
        <text class="wl" x="260" y="135" font-size="14" fill="currentColor">w₁ = 0.5</text>
        <text class="wl" x="260" y="262" font-size="14" fill="currentColor">w₂ = −0.25</text>
        <circle class="anim node" cx="430" cy="190" r="34" fill="var(--panel)" stroke="currentColor" stroke-width="3"/>
        <text class="anim node" x="430" y="186" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">Σ</text>
        <text class="anim node" x="430" y="206" text-anchor="middle" font-size="12" fill="currentColor">+ b = 0.1</text>
        <rect class="anim node" x="530" y="160" width="90" height="60" rx="8" fill="var(--panel)" stroke="currentColor" stroke-width="3"/>
        <polyline class="anim node" points="548,205 575,205 602,172" fill="none" stroke="currentColor" stroke-width="3"/>
        <text class="wl" x="490" y="178" text-anchor="middle" font-size="13" fill="currentColor">z = ${f(R.z,2)}</text>
        ${small(575,240,"ReLU = max(0, z)",'text-anchor="middle"')}
      </g>
      <g class="c-client">
        <circle class="anim node" cx="120" cy="130" r="32" fill="var(--panel)" stroke="currentColor" stroke-width="3"/><text class="anim node mono" x="120" y="135" text-anchor="middle" font-size="16" fill="currentColor">${xs[0]}</text>
        <circle class="anim node" cx="120" cy="270" r="32" fill="var(--panel)" stroke="currentColor" stroke-width="3"/><text class="anim node mono" x="120" y="275" text-anchor="middle" font-size="16" fill="currentColor">${xs[1]}</text>
        ${small(120,182,"x₁",'text-anchor="middle"')}${small(120,322,"x₂",'text-anchor="middle"')}
        <circle class="anim yv" cx="725" cy="190" r="34" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-width="3"/><text class="anim yv mono" x="725" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor">${f(R.relu,2)}</text>
        ${small(725,245,"y",'text-anchor="middle"')}
      </g>
      ${small(400,350,"linear part: multiply and sum   ·   non-linear part: ReLU",'text-anchor="middle"')}`,
      "Neuron diagram: two client inputs flow along weighted edges into a sum with bias, then ReLU, producing y for the client."); },
  play(){ pop(".node",0,60); draw(".edge",350,700); fade(".wl",900); pop(".yv",1500); },
  math:()=>`<div class="formula">z = w₁·x₁ + w₂·x₂ + b = ${f(R.x[0],2)}·0.5 + ${f(R.x[1],2)}·(−0.25) + 0.1 = ${f(R.z)}</div><div class="formula">y = ReLU(z) = max(0, z) = ${f(R.relu)}</div><p>The linear part stands for every matrix product in attention and feed-forward layers. ReLU stands for GELU, SiLU and Softmax. Every lesson in this series runs exactly this neuron.</p>`
},
{ key:"Keys", who:"client", whoT:"client", at:0, lv:4, scale:"—", err:()=>0,
  title:"Make keys",
  cap:()=>`The secret key is a tiny polynomial with coefficients in {−1, 0, 1}. It never leaves the client. Three public keys go to the server.`,
  scene(){ const tiles=R.s.map((c,i)=>tile(40+i*62,110,54,54,big(c),"c-client","sk")).join("");
    const key=(y,name,sub,i)=>`<g class="c-server keyg"><rect x="470" y="${y}" width="290" height="58" rx="8" fill="currentColor" fill-opacity=".08" stroke="currentColor" stroke-width="2"/>
      <circle cx="497" cy="${y+29}" r="9" fill="none" stroke="currentColor" stroke-width="3"/><path d="M506,${y+29} h22 m-6,0 v8 m-8,-8 v6" stroke="currentColor" stroke-width="3" fill="none"/>
      <text x="545" y="${y+25}" font-size="14" font-weight="700" fill="currentColor">${name}</text><text x="545" y="${y+44}" font-size="12" fill="currentColor" class="c-muted">${sub}</text></g>`;
    return svg(330,`
      ${lbl(40,60,"SECRET KEY  s(X)","class=\"c-client\" font-weight=\"700\"")}${small(40,80,"4 coefficients, kept by the client")}
      ${tiles}
      ${["s₀","s₁","s₂","s₃"].map((t,i)=>small(67+i*62,186,t,'text-anchor="middle"')).join("")}
      <g class="c-client">${lock(152,210)}</g>${small(175,224,"never sent")}
      <line x1="320" y1="30" x2="320" y2="310" stroke="currentColor" stroke-dasharray="4 6" opacity=".5"/>${small(330,300,"network")}
      <g class="c-muted"><path class="flow" pathLength="1" stroke-dasharray="1" d="M290,137 C360,137 380,70 462,70" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#ahm)"/>
      <path class="flow" pathLength="1" stroke-dasharray="1" d="M290,137 L462,150" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#ahm)"/>
      <path class="flow" pathLength="1" stroke-dasharray="1" d="M290,137 C360,137 380,230 462,230" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#ahm)"/></g>
      ${key(40,"public key","encrypt new data",0)}${key(120,"relinearization key","encrypts s² · fixes ct × ct",1)}${key(200,"rotation key","encrypts s(X⁵) · moves slots",2)}`,
      "The four secret key coefficients stay with the client; public, relinearization and rotation keys are derived and sent to the server."); },
  play(){ A(".sk",[{opacity:0,transform:"scaleY(0)"},{opacity:1,transform:"scaleY(1)"}],{s:110,d:500}); pop(".lock",600); draw(".flow",800,600); slide(".keyg",-120,0,1100,160); },
  math:()=>`<div class="formula">s(X) = ${polyStr(R.s)}</div><div class="formula">public key = ( −a·s + e ,  a )  mod q,  a random, e small</div><p>All polynomials live in the ring where X⁴ = −1, so products wrap around with a sign flip. The relinearization and rotation keys are encryptions of s² and of s(X⁵) under s, so they reveal nothing about s.</p>`
},
{ key:"Encode", who:"client", whoT:"client", at:0, lv:4, scale:"Δ = 2²⁰", err:()=>Math.abs(R.back[0]-R.x[0]),
  title:"Encode: numbers become a polynomial",
  cap:()=>`Scale by Δ = 2²⁰ to keep about 6 decimals, then pack both numbers into one polynomial. Every later operation hits both slots at once.`,
  scene(){ const sc=R.x.map(v=>Math.round(v*2**20));
    const ring=(cx,cy,r)=>{ let g=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="currentColor" opacity=".35"/>`+small(cx,cy+r+24,"the 4 roots of X⁴ + 1",'text-anchor="middle"')+`<g class="c-client"><text x="${cx}" y="${cy+r+44}" text-anchor="middle" font-size="12" fill="currentColor">slot 1 = m(ζ)/Δ · slot 2 = m(ζ⁵)/Δ</text></g>`;
      [[1,"slot 1"],[5,"slot 2"],[7,""],[3,""]].forEach(([k,t],i)=>{ const a=k*Math.PI/4, x=cx+r*Math.cos(a), y=cy-r*Math.sin(a);
        g+=`<g class="${t?"c-client":"c-muted"} rootpt"><circle class="anim" cx="${x}" cy="${y}" r="${t?8:5}" fill="currentColor"/>${t?`<text x="${x+(Math.cos(a)>0?12:-12)}" y="${y+4}" font-size="13" font-weight="700" text-anchor="${Math.cos(a)>0?"start":"end"}" fill="currentColor">${t.slice(-1)}</text>`:""}</g>`; }); return g; };
    return svg(360,`
      ${small(40,40,"SLOTS")}
      <g class="sl">${tile(40,52,90,54,+R.x[0].toFixed(3),"c-client")}</g><g class="sl">${tile(140,52,90,54,+R.x[1].toFixed(3),"c-client")}</g>
      <g class="c-muted ar1"><line x1="240" y1="79" x2="302" y2="79" stroke="currentColor" stroke-width="2" marker-end="url(#ahm)"/></g>${small(270,68,"× Δ",'text-anchor="middle"')}
      ${small(310,40,"SCALED INTEGERS")}
      <g class="c-client sc"><rect x="310" y="52" width="110" height="54" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><text id="cu0" class="mono" x="365" y="84" text-anchor="middle" font-size="14" fill="currentColor">${sc[0]}</text></g>
      <g class="c-client sc"><rect x="430" y="52" width="110" height="54" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><text id="cu1" class="mono" x="485" y="84" text-anchor="middle" font-size="14" fill="currentColor">${sc[1]}</text></g>
      <g class="c-muted ar2"><path d="M310,114 v8 h230 v-8 M425,122 V188" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#ahm)"/><path d="M40,204 v-8 h510 v8" fill="none" stroke="currentColor" stroke-width="2"/></g>${small(436,160,"inverse embedding")}
      ${small(40,184,"POLYNOMIAL  m(X) = m₀ + m₁X + m₂X² + m₃X³")}
      ${R.m.map((c,i)=>`<g class="co">${tile(40+i*130,212,120,54,big(c),"c-client")}</g>`).join("")}
      ${["m₀","m₁","m₂","m₃"].map((t,i)=>small(100+i*130,288,t,'text-anchor="middle"')).join("")}
      ${ring(680,100,56)}`,
      "Two slot values are multiplied by delta, then turned into four integer polynomial coefficients; the slots are the polynomial's values at two roots of unity."); },
  play(){ pop(".sl",0,120); fade(".ar1",400); pop(".sc",600,120); countUp("cu0",Math.round(R.x[0]*2**20),600); countUp("cu1",Math.round(R.x[1]*2**20),700); fade(".ar2",1300); slide(".co",0,-40,1500,110); pop(".rootpt",2000,120); },
  math:()=>`<div class="formula">m(X) = ${polyStr(R.m)}</div><div class="formula">decode(m) = [ ${R.back.map(v=>v.toFixed(6)).join(", ")} ]   rounding error ${fe(Math.abs(R.back[0]-R.x[0]))}</div><p>Slot j is the value of m(X) at a complex root of X⁴ + 1, divided by Δ. Because evaluating polynomials respects + and ×, adding or multiplying polynomials adds or multiplies all slots at once. This is SIMD packing.</p>`
},
{ key:"Encrypt", who:"client", whoT:"client", at:0.5, lv:4, scale:"Δ = 2²⁰", err:()=>R.err.enc,
  title:"Encrypt: hide it under noise",
  cap:()=>`The polynomial becomes two random-looking polynomials c₀, c₁. Only the secret key turns them back into the message plus a tiny noise e.`,
  scene(){ const bars=(y,arr,name)=>arr.map((v,i)=>`<g class="c-client"><rect class="bar" style="transform-box:fill-box;transform-origin:bottom" x="${60+i*70}" y="${y-6-v*90}" width="46" height="${6+v*90}" rx="3" fill="currentColor" fill-opacity=".55"/></g>`).join("")+lbl(20,y-30,name,'font-weight="700"')+`<line x1="50" y1="${y}" x2="340" y2="${y}" stroke="currentColor" opacity=".3"/>`;
    const msgW=210, bits=(R.m.reduce((a,v)=>a>(v<0n?-v:v)?a:(v<0n?-v:v),0n)).toString(2).length;
    return svg(360,`
      ${bars(150,R.bars0,"c₀")}${bars(300,R.bars1,"c₁")}
      ${small(60,330,"each bar = one 90-bit coefficient, scaled to its range: looks uniformly random")}
      <g class="c-muted"><line x1="370" y1="30" x2="370" y2="330" stroke="currentColor" opacity=".3"/></g>
      ${lbl(400,48,"c₀ + c₁·s  =  Δ·m + e","class=\"mono\" font-weight=\"700\"")}
      ${small(400,72,"one decrypted coefficient, bit 89 → bit 0")}
      <rect x="400" y="86" width="370" height="46" rx="4" fill="none" stroke="currentColor"/>
      <rect class="seg1" x="400" y="86" width="247" height="46" fill="currentColor" opacity=".07"/>
      <g class="c-client"><rect class="seg2" x="647" y="86" width="${110}" height="46" fill="currentColor" opacity=".35"/></g>
      <g class="c-noise"><rect class="seg3" x="757" y="86" width="13" height="46" fill="currentColor" opacity=".8"/></g>
      ${small(523,114,"headroom: 60 bits",'text-anchor="middle"')}<text x="702" y="114" text-anchor="middle" font-size="12" fill="currentColor" class="c-client">Δ·m ≈ ${bits} bits</text>
      <text x="764" y="152" text-anchor="middle" font-size="12" fill="currentColor" class="c-noise">e</text>
      ${small(400,180,"Decrypting the c₀, c₁ on the left gives:")}
      ${R.dm.map((v,i)=>`<g class="dm">${tile(400+i*94,192,86,44,big(v),"c-client")}</g>`).join("")}
      ${small(400,262,"which is the message m plus noise e:")}
      ${R.e.map((v,i)=>`<g class="ee">${tile(400+i*94,272,86,40,(v>0n?"+":"")+big(v),"c-noise")}</g>`).join("")}`,
      "Two rows of random-looking bars are the ciphertext; a bit register shows the decrypted value as headroom, scaled message and a few noise bits."); },
  play(){ A(".bar",[{transform:"scaleY(.08)"},{transform:"scaleY(1.25)"},{transform:"scaleY(.45)"},{transform:"scaleY(1)"}],{s:60,d:1100}); A(".seg1,.seg2,.seg3",[{opacity:0},{opacity:1}],{t:900,s:250}); pop(".dm",1500,90); pop(".ee",2000,90); },
  math:()=>`<div class="formula">c₀ = [ ${R.ct.c[0].map(v=>hex(v,q[3])).join(", ")} ]</div><div class="formula">c₁ = [ ${R.ct.c[1].map(v=>hex(v,q[3])).join(", ")} ]</div><div class="formula">c₀ + c₁·s = [ ${R.dm.map(big).join(", ")} ]   e = [ ${R.e.map(big).join(", ")} ]</div><p>Recovering m from (c₀, c₁) without s is the Ring Learning-With-Errors problem, believed hard even for quantum computers. The noise is never removed in CKKS. It just sits below the precision you care about.</p>`
},
{ key:"× w", who:"server", whoT:"server", at:1, lv:3, scale:"Δ² → Δ", err:()=>R.err.w,
  title:"Multiply by the weights, then rescale",
  cap:()=>`One multiplication scales both slots by w at once. The scale jumps to Δ², so the server divides by Δ and drops 20 bits: one level is gone.`,
  scene(){ const enc=(x,y,t)=>`<g class="c-client">${tile(x,y,96,52,t,"c-client")}</g>${lock(x+74,y+6)}`;
    return svg(372,`
      ${small(40,34,"ENCRYPTED SLOTS")}${enc(40,46,"x₁")}${enc(146,46,"x₂")}
      <text class="op" x="268" y="80" font-size="26" fill="currentColor" text-anchor="middle">×</text>
      ${small(300,34,"PLAINTEXT WEIGHTS")}<g class="wt">${tile(300,46,96,52,"0.5","c-server")}</g><g class="wt">${tile(406,46,96,52,"−0.25","c-server")}</g>
      <text class="op" x="530" y="80" font-size="26" fill="currentColor" text-anchor="middle">=</text>
      ${small(560,34,"ENCRYPTED PRODUCTS")}<g class="res">${tile(560,46,96,52,"x₁w₁","c-client")}</g><g class="res">${tile(666,46,96,52,"x₂w₂","c-client")}</g>
      ${small(560,118,"decrypt to "+f(R.v4[0])+" and "+f(R.v4[1]))}
      ${lbl(40,170,"Modulus budget of the ciphertext","font-weight=\"700\"")}
      <g class="regA">${small(40,196,"after × w: scale Δ², level 3, 90 bits")}
        <rect x="40" y="206" width="720" height="40" rx="4" fill="none" stroke="currentColor"/>
        <rect x="40" y="206" width="400" height="40" fill="currentColor" opacity=".07"/>
        <g class="c-client"><rect x="440" y="206" width="320" height="40" fill="currentColor" opacity=".35"/></g>
        <text x="520" y="231" text-anchor="middle" font-size="13" fill="currentColor" class="c-client">Δ²·(x⊙w): 40 bits</text>
        <g class="cut c-noise"><rect x="600" y="202" width="160" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><text x="680" y="268" text-anchor="middle" font-size="12" fill="currentColor">÷ Δ removes 20 bits</text></g>
      </g>
      <g class="regB">${small(40,300,"after rescale: scale Δ, level 2, 70 bits")}
        <rect x="40" y="310" width="560" height="40" rx="4" fill="none" stroke="currentColor"/>
        <rect x="40" y="310" width="400" height="40" fill="currentColor" opacity=".07"/>
        <g class="c-client"><rect x="440" y="310" width="160" height="40" fill="currentColor" opacity=".35"/></g>
        <text x="520" y="335" text-anchor="middle" font-size="13" fill="currentColor" class="c-client">Δ·(x⊙w)</text>
        <g class="c-muted"><rect x="600" y="310" width="160" height="40" fill="none" stroke="currentColor" stroke-dasharray="3 5"/></g>${small(680,335,"gone for good",'text-anchor="middle"')}
      </g>`,
      "Encrypted slots times plaintext weights give encrypted products; a modulus bar shows the 40-bit scaled result, then rescaling cuts 20 bits and the bar shrinks from 90 to 70 bits."); },
  play(){ pop(".lock",0,60); slide(".wt",0,-50,300,120); fade(".op",500,200); pop(".res",900,120); fade(".regA",1300); A(".cut",[{opacity:0},{opacity:1},{opacity:.3},{opacity:1}],{t:1900,d:900}); slide(".regB",0,-60,2700); },
  math:()=>`<table class="nums"><thead><tr><th>after</th><th>slot 1</th><th>slot 2</th><th>exact</th><th>error</th></tr></thead><tbody>
    <tr><td>× w (scale Δ², L3)</td><td class="v">${f(R.v4a[0],6)}</td><td class="v">${f(R.v4a[1],6)}</td><td class="v">${f(R.prod[0])} / ${f(R.prod[1])}</td><td class="v c-noise">${fe(Math.max(Math.abs(R.v4a[0]-R.prod[0]),Math.abs(R.v4a[1]-R.prod[1])))}</td></tr>
    <tr><td>rescale (scale Δ, L2)</td><td class="v">${f(R.v4[0],6)}</td><td class="v">${f(R.v4[1],6)}</td><td class="v">${f(R.prod[0])} / ${f(R.prod[1])}</td><td class="v c-noise">${fe(R.err.w)}</td></tr></tbody></table>
    <p>The weights are encoded like the input but not encrypted. Plaintext × ciphertext is the cheap kind of multiplication and needs no key.</p>`
},
{ key:"Rotate + add", who:"server", whoT:"server", at:1, lv:3, scale:"Δ", err:()=>R.err.z,
  title:"Rotate and add, then add the bias",
  cap:()=>`Slots can only be added position by position. So the server rotates a copy, swapping the slots, adds it to the original, then adds b. Neither step uses a level.`,
  scene(){ const row=(y,a,b,cls,name)=>`<g class="${cls}">${tile(250,y,120,50,a,"c-server")}${tile(390,y,120,50,b,"c-server")}</g>${lbl(40,y+31,name)}`;
    return svg(380,`
      ${row(30,f(R.v4[0]),f(R.v4[1]),"r1","ct  (x⊙w)")}
      <g class="r2"><g class="sw1">${tile(250,120,120,50,f(R.vr[0]),"c-server")}</g><g class="sw2">${tile(390,120,120,50,f(R.vr[1]),"c-server")}</g></g>${lbl(40,151,"rotate(ct)")}
      <g class="c-muted"><text x="540" y="140" font-size="13" fill="currentColor">X → X⁵ swaps the slots</text><text x="540" y="158" font-size="12" fill="currentColor">+ key switch (rotation key)</text></g>
      <text class="pl" x="226" y="248" font-size="24" fill="currentColor" text-anchor="middle">+</text><g class="c-server sw"><line x1="318" y1="84" x2="448" y2="116" stroke="currentColor" stroke-width="2" marker-end="url(#ahs)"/><line x1="448" y1="84" x2="318" y2="116" stroke="currentColor" stroke-width="2" marker-end="url(#ahs)"/></g>
      ${row(215,f(R.v5[0]),f(R.v5[1]),"r3","ct + rotate(ct)")}
      <g class="c-muted pl"><text x="540" y="240" font-size="13" fill="currentColor">every slot now holds w₁x₁ + w₂x₂</text></g>
      <g class="bias">${tile(320,282,120,36,"+ b = 0.1","c-server")}</g>
      ${row(330,f(R.vz[0]),f(R.vz[1]),"r4","z")}
      <g class="c-ok r4"><text x="540" y="361" font-size="13" fill="currentColor">z = ${f(R.z)} hidden in both slots</text></g>`,
      "A copy of the ciphertext is rotated so the two slots swap places, then added to the original so both slots hold the sum, and the bias is added."); },
  play(){ fade(".r1",0); slide(".r2",0,-90,400,0); fade(".sw",900); A(".sw1",[{transform:"translate(140px,0)"},{transform:"translate(0,0)"}],{t:1000,d:800}); A(".sw2",[{transform:"translate(-140px,0)"},{transform:"translate(0,0)"}],{t:1000,d:800}); fade(".pl",1800); pop(".r3",2000,0); slide(".bias",0,-40,2600); pop(".r4",3000,0); },
  math:()=>`<table class="nums"><thead><tr><th>after</th><th>slot 1</th><th>slot 2</th><th>error</th></tr></thead><tbody>
    <tr><td>rotate(ct)</td><td class="v">${f(R.vr[0],6)}</td><td class="v">${f(R.vr[1],6)}</td><td class="v c-noise">${fe(Math.abs(R.vr[0]-R.prod[1]))}</td></tr>
    <tr><td>ct + rotate(ct)</td><td class="v">${f(R.v5[0],6)}</td><td class="v">${f(R.v5[1],6)}</td><td class="v c-noise">${fe(Math.abs(R.v5[0]-R.dot))}</td></tr>
    <tr><td>+ b</td><td class="v">${f(R.vz[0],6)}</td><td class="v">${f(R.vz[1],6)}</td><td class="v c-noise">${fe(R.err.z)}</td></tr></tbody></table>
    <p>Rotation substitutes X → X⁵, which leaves the ciphertext under the key s(X⁵). Key switching converts it back to s. A 4096-wide LLM dot product needs 12 such rounds, which is why rotation counts drive the SoK's packing layouts.</p>`
},
{ key:"ReLU", who:"server", whoT:"server", at:1, lv:1, scale:"Δ", err:()=>R.err.y,
  title:"ReLU becomes a polynomial",
  cap:()=>`CKKS can only add and multiply, so ReLU is replaced by p(z) = 0.094 + 0.5z + 0.469z². Two more multiplications use up the last levels.`,
  scene(){ const X0=40,X1=470,Y0=330,Y1=40, xmin=-1.5,xmax=1.5,ymin=-0.2,ymax=1.6;
    const sx=v=>X0+(v-xmin)/(xmax-xmin)*(X1-X0), sy=v=>Y0-(v-ymin)/(ymax-ymin)*(Y0-Y1);
    const path=fn=>{ let d=""; for(let i=0;i<=90;i++){ const v=xmin+(xmax-xmin)*i/90; d+=(i?"L":"M")+sx(v).toFixed(1)+","+sy(Math.min(ymax+0.4,Math.max(ymin-0.4,fn(v)))).toFixed(1); } return d; };
    const p=v=>C0+C1*v+C2*v*v, z=Math.min(xmax,Math.max(xmin,R.z));
    let g=`<clipPath id="pc"><rect x="${X0}" y="${Y1}" width="${X1-X0}" height="${Y0-Y1}"/></clipPath><rect x="${sx(-1)}" y="${Y1}" width="${sx(1)-sx(-1)}" height="${Y0-Y1}" fill="currentColor" opacity=".05"/>${small(sx(-1)+8,Y1+16,"fitted on [−1, 1]")}
      <line x1="${X0}" y1="${sy(0)}" x2="${X1}" y2="${sy(0)}" stroke="currentColor" opacity=".35"/><line x1="${sx(0)}" y1="${Y1}" x2="${sx(0)}" y2="${Y0}" stroke="currentColor" opacity=".35"/>
      ${[-1,1].map(t=>small(sx(t),sy(0)+16,String(t).replace("-","−"),'text-anchor="middle"')).join("")}${small(sx(0)-6,sy(1)+4,"1",'text-anchor="end"')}
      <g clip-path="url(#pc)"><g class="c-ok"><path class="cv" pathLength="1" stroke-dasharray="1" d="${path(v=>Math.max(0,v))}" fill="none" stroke="currentColor" stroke-width="3"/></g>
      <g class="c-server"><path class="cv" pathLength="1" stroke-dasharray="1" d="${path(p)}" fill="none" stroke="currentColor" stroke-width="3"/></g></g><g class="c-ok"><text x="${sx(1.3)+6}" y="${sy(1.05)}" font-size="13" font-weight="700" fill="currentColor">ReLU</text></g><g class="c-server"><text x="${sx(-1.45)}" y="${sy(0.95)}" font-size="13" font-weight="700" fill="currentColor">p(z)</text></g>
      <g class="pt"><line x1="${sx(z)}" y1="${sy(Math.max(0,z))}" x2="${sx(z)}" y2="${sy(Math.min(ymax,p(z)))}" class="c-warn" stroke="currentColor" stroke-width="3"/>
      <g class="c-ok"><circle cx="${sx(z)}" cy="${sy(Math.max(0,z))}" r="6" fill="currentColor"/></g><g class="c-server"><circle cx="${sx(z)}" cy="${sy(Math.min(ymax,p(z)))}" r="6" fill="currentColor"/></g>
      <text x="${sx(z)+14}" y="${sy(Math.max(0,z))+26}" font-size="13" fill="currentColor" class="c-warn">gap ${Math.abs(p(z)-Math.max(0,z)).toFixed(3)} at z = ${f(R.z,2)}</text></g>
      ${Math.abs(R.z)>1?`<text x="${X1}" y="${Y0+22}" text-anchor="end" font-size="13" fill="currentColor" class="c-warn">z outside the interval: badly wrong</text>`:""}`;
    const node=(y,t,lv,i)=>`<g class="pipe"><g class="c-server"><rect x="540" y="${y}" width="170" height="44" rx="6" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2"/><text x="625" y="${y+27}" text-anchor="middle" font-size="14" fill="currentColor" class="mono">${t}</text></g>
      <g class="c-client"><rect x="720" y="${y+10}" width="44" height="24" rx="4" fill="currentColor" fill-opacity=".15" stroke="currentColor"/><text x="742" y="${y+27}" text-anchor="middle" font-size="12" fill="currentColor" class="mono">${lv}</text></g>${i<3?`<line x1="625" y1="${y+44}" x2="625" y2="${y+66}" stroke="currentColor" stroke-width="2" marker-end="url(#ahs)"/>`:""}</g>`;
    g+=small(540,40,"evaluation order")+node(52,"z","L2",0)+node(120,"z · z  (relin)","L1",1)+node(188,"× 0.46875","L0",2)+node(256,"+ 0.5z + 0.094","L0",3);
    g+=`<g class="boot c-warn"><rect x="540" y="318" width="224" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><text x="652" y="340" text-anchor="middle" font-size="13" fill="currentColor">next layer needs bootstrapping</text></g>`;
    return svg(370,g,"ReLU and its degree-two polynomial approximation, with the gap at the current z, and the evaluation order that consumes levels down to L0."); },
  play(){ draw(".cv",0,1100); pop(".pt",1300); slide(".pipe",-30,0,600,350); A(".boot",[{opacity:0},{opacity:1},{opacity:.35},{opacity:1}],{t:2200,d:1000}); },
  math:()=>`<div class="formula">ReLU(z) ≈ p(z) = 0.09375 + 0.5·z + 0.46875·z²</div><table class="nums"><thead><tr><th>after</th><th>level</th><th>value</th><th>exact</th><th>error</th></tr></thead><tbody>
    <tr><td>z · z, relinearize, rescale</td><td class="v">L1</td><td class="v">${f(R.vzz,6)}</td><td class="v">${f(R.z*R.z,6)}</td><td class="v c-noise">${fe(Math.abs(R.vzz-R.z*R.z))}</td></tr>
    <tr><td>× 0.46875, rescale</td><td class="v">L0</td><td class="v">${f(R.vt,6)}</td><td class="v">${f(C2*R.z*R.z,6)}</td><td class="v c-noise">${fe(Math.abs(R.vt-C2*R.z*R.z))}</td></tr>
    <tr><td>0.5·z, rescale, drop to L0</td><td class="v">L0</td><td class="v">${f(R.vu,6)}</td><td class="v">${f(C1*R.z,6)}</td><td class="v c-noise">${fe(Math.abs(R.vu-C1*R.z))}</td></tr>
    <tr><td>sum + 0.09375 = p(z)</td><td class="v">L0</td><td class="v">${f(R.vy,6)}</td><td class="v">${f(R.poly,6)}</td><td class="v c-noise">${fe(R.err.y)}</td></tr></tbody></table>
    <p>Ciphertext × ciphertext gives three polynomials. Relinearization with the relinearization key folds them back to two. Higher-degree polynomials fit ReLU better but cost more levels. In real LLMs, bootstrapping takes 50–75% of the time (SoK §4.2.1).</p>`
},
{ key:"Decrypt", who:"client", whoT:"client", at:0, lv:1, scale:"Δ", err:()=>Math.abs(R.vy-R.relu),
  title:"Decrypt and compare",
  cap:()=>`The client decrypts <b>${f(R.vy)}</b>. The true answer is ${f(R.relu)}. Almost all of the gap comes from the ReLU approximation, not from encryption.`,
  scene(){ const lg=v=>Math.max(0,Math.min(1,(Math.log10(Math.max(v,1e-8))+8)/8)); const W0=200,W1=740, bw=v=>(W1-W0)*lg(v);
    const ap=Math.abs(R.poly-R.relu), nz=Math.abs(R.vy-R.poly);
    return svg(340,`
      <g class="c-client big"><text x="40" y="70" font-size="13" fill="currentColor" font-weight="700">CLIENT DECRYPTS</text><text x="40" y="118" font-size="44" font-family="var(--mono)" fill="currentColor">${f(R.vy)}</text></g>
      <g class="c-ok big"><text x="330" y="70" font-size="13" fill="currentColor" font-weight="700">TRUE ReLU(z)</text><text x="330" y="118" font-size="44" font-family="var(--mono)" fill="currentColor">${f(R.relu)}</text></g>
      <g class="c-server big"><text x="590" y="70" font-size="13" fill="currentColor" font-weight="700">POLYNOMIAL p(z)</text><text x="590" y="118" font-size="44" font-family="var(--mono)" fill="currentColor">${f(R.poly)}</text></g>
      ${lbl(40,180,"Where the error comes from (log scale)","font-weight=\"700\"")}
      ${[-8,-6,-4,-2,0].map(e=>`<line x1="${W0+(W1-W0)*(e+8)/8}" y1="196" x2="${W0+(W1-W0)*(e+8)/8}" y2="300" stroke="currentColor" opacity=".15"/>${small(W0+(W1-W0)*(e+8)/8,318,"10"+sup(e),'text-anchor="middle"')}`).join("")}
      ${small(40,226,"ReLU approximation")}<g class="c-warn"><rect class="eb" x="${W0}" y="208" width="${bw(ap)}" height="28" rx="3" fill="currentColor"/><text x="${W0+bw(ap)+8}" y="227" font-size="13" fill="currentColor">${fe(ap)}</text></g>
      ${small(40,272,"encryption noise")}<g class="c-noise"><rect class="eb" x="${W0}" y="254" width="${bw(nz)}" height="28" rx="3" fill="currentColor"/><text x="${W0+bw(nz)+8}" y="273" font-size="13" fill="currentColor">${fe(nz)}</text></g>`,
      "The decrypted value, true answer and polynomial value side by side, with a log-scale bar chart showing the approximation error is thousands of times bigger than the encryption noise."); },
  play(){ pop(".big",0,250); A(".eb",[{transform:"scaleX(0)",transformOrigin:"left"},{transform:"scaleX(1)",transformOrigin:"left"}],{t:900,s:300,d:900}); },
  math:()=>`<div class="formula">decode(c₀ + c₁·s) = ${f(R.vy,6)}</div><p>The encryption noise (${fe(Math.abs(R.vy-R.poly))}) is set by Δ and grows slowly. The approximation error (${fe(Math.abs(R.poly-R.relu))}) is set by how well a polynomial imitates ReLU. Model-preserving frameworks in the SoK spend most of their effort on the second number.</p>`
}
];

const EXPLAIN=[
()=>`<p>Private inference has two parties. The <b class="c-client">client</b> has private data, here a token embedding x. The <b class="c-server">server</b> has a model it does not want to give away, here the weights w and bias b of one neuron.</p>
<p>The neuron does the two kinds of work every Transformer layer does:</p>
<ul><li><b>Linear:</b> z = w₁x₁ + w₂x₂ + b. This is a tiny matrix product. In an LLM, these products hold almost all the parameters and most of the arithmetic.</li>
<li><b>Non-linear:</b> y = ReLU(z) = max(0, z). It stands in for GELU, SiLU, Softmax and LayerNorm. These are the operations encryption schemes find hardest.</li></ul>
<p>In the non-interactive setting the client sends one encrypted message and gets one encrypted answer back. The server must do all the work without ever seeing x, z or y. Every lesson in this series uses exactly these numbers, so you can compare how each scheme copes with each half of the neuron.</p>`,
()=>`<p>CKKS keys are polynomials. In this toy every polynomial has 4 coefficients, and arithmetic wraps around with X⁴ = −1. The <b class="c-client">secret key</b> s has coefficients in {−1, 0, 1}. Small keys keep the noise small, and security comes from the size of the ring, not from large key values.</p>
<p>From s the client derives three keys it can safely publish:</p>
<ul><li><b>Public key</b> (−a·s + e, a). The random polynomial a hides s, and the small noise e makes the hiding hard to undo. This is the Ring Learning-With-Errors problem.</li>
<li><b>Relinearization key</b>, an encryption of s². Multiplying two ciphertexts produces a term that needs s² to decrypt. This key lets the server turn it back into a normal ciphertext.</li>
<li><b>Rotation key</b>, an encryption of s(X⁵). Moving values between slots changes the key to s(X⁵). This key switches it back to s.</li></ul>
<p>In real deployments these evaluation keys are large, often gigabytes. Their size is one reason the SoK highlights small-key bootstrapping research.</p>`,
()=>`<p>Encryption works on integer polynomials, but our data are real numbers. Encoding bridges the two in two moves.</p>
<h3>1. Scale</h3><p>Multiply by Δ = 2²⁰ and round. Then 1.5 becomes 1,572,864, and about six decimal digits survive the rounding. A larger Δ keeps more digits but uses more of the modulus at every multiplication.</p>
<h3>2. Pack</h3><p>Find the polynomial m(X) whose values at two special complex numbers, roots of X⁴ + 1, equal the two scaled inputs. The other two roots are mirror images and hold the complex conjugates, so the coefficients come out real.</p>
<p>Why bother? Because adding or multiplying polynomials adds or multiplies their values at every root at the same time. One polynomial operation is a vector operation on all slots. With N = 65,536, one ciphertext carries 32,768 numbers. This SIMD packing is the main reason CKKS dominates encrypted LLM work.</p>`,
()=>`<p>Encryption adds the message to an encryption of zero built from the public key: c₀ = pk₀·u + e₀ + Δm and c₁ = pk₁·u + e₁, with a fresh random u and small noises e₀, e₁.</p>
<p>Anyone holding s can compute c₀ + c₁·s. The large random parts cancel and leave Δm + e, where e is a few units. Without s the two polynomials are indistinguishable from random numbers. That is why the bars look like noise.</p>
<p>The register picture shows the layout of one decrypted coefficient. The noise sits in the lowest bits and the scaled message just above it. The unused high bits are the budget the server will spend: every multiplication doubles the scale and needs a rescale that eats 20 bits.</p>
<p>The noise is never cleaned away. CKKS treats it as part of the rounding error of approximate arithmetic. It is also why decrypted CKKS results must not be shared back with the server: they leak information about s (Li–Micciancio, EUROCRYPT 2021).</p>`,
()=>`<p>The server encodes w = [0.5, −0.25] as a plaintext polynomial and multiplies it into both c₀ and c₁. Decryption is linear, so the result decrypts to Δ²·(x ⊙ w): each slot multiplied by its own weight, both at once.</p>
<p>The scale is now Δ², a 40-bit number. If nothing were done, the next multiplication would make it Δ⁴, and the message would quickly overflow the modulus. <b>Rescaling</b> divides the ciphertext by Δ. That brings the scale back to Δ, removes 20 bits of modulus, and also divides the accumulated noise.</p>
<p>The modulus is a ladder of levels, here 90 → 70 → 50 → 30 bits. Each multiplication climbs down one rung. Real CKKS keeps about 10 to 20 levels between bootstraps, so the depth of each layer is a hard budget the SoK frameworks plan carefully.</p>
<p>Plaintext × ciphertext is the cheap case. It needs no key and adds little noise, which is why keeping the model weights unencrypted is the common SoK threat model.</p>`,
()=>`<p>After the multiplication, slot 1 holds w₁x₁ and slot 2 holds w₂x₂, but we need their sum. CKKS can only add slot 1 to slot 1 and slot 2 to slot 2, so the values must first be lined up.</p>
<p><b>Rotation</b> moves values between slots. Substituting X → X⁵ in both ciphertext polynomials permutes the slots, which here is a swap. The catch is that the ciphertext now decrypts under s(X⁵), not s. <b>Key switching</b> with the rotation key fixes that, at the cost of one expensive operation.</p>
<p>Adding the rotated copy gives w₁x₁ + w₂x₂ in every slot. Adding the encoded bias gives z. Additions cost no level.</p>
<p>For a length-n dot product, this rotate-and-add trick needs log₂ n rotations, 12 for n = 4096. Matrix products in LLMs are thousands of these, so the SoK's packing classes (row, column/diagonal, cyclic) are all strategies to need fewer rotations and fewer rotation keys.</p>`,
()=>`<p>ReLU is a comparison, max(0, z), and CKKS has no comparison instruction. The standard fix is to evaluate a polynomial that is close to ReLU wherever z is expected to fall.</p>
<p>Here p(z) = 0.09375 + 0.5z + 0.46875z² is the best degree-2 fit on [−1, 1]. It is the average of z and a quadratic fit to |z|. Inside the interval the gap is a few hundredths. Outside it the polynomial grows quickly and the answer becomes wrong. Try x₁ = 4 to see it.</p>
<p>Evaluating p costs depth. <b>z · z</b> multiplies two ciphertexts, which yields three polynomials. Relinearization with the s² key compresses them back to two, then a rescale follows. Multiplying by 0.46875 is another rescale. The 0.5·z branch is rescaled and dropped to the same level so the parts can be added.</p>
<p>We are now at level 0. Another layer would need <b>bootstrapping</b>, which homomorphically re-runs decryption to climb back up the ladder. It is the single most expensive CKKS operation. Real model-preserving frameworks use degree 15 to 60 approximations or iterative methods (Newton, Goldschmidt, normalize-and-square) and bootstrap many times per layer.</p>`,
()=>`<p>The server returns one ciphertext. The client computes c₀ + c₁·s, divides by Δ and reads slot 1.</p>
<p>Comparing three numbers separates two kinds of error:</p>
<ul><li><b class="c-noise">Encryption noise</b>, the decrypted value minus p(z). It is set by Δ and the noise distribution, and is around 10⁻⁶ here.</li>
<li><b class="c-warn">Approximation error</b>, p(z) minus ReLU(z). It is set by the polynomial degree and interval, and is around 10⁻² here.</li></ul>
<p>This matches the SoK's finding for real models. With careful parameters, CKKS noise barely affects accuracy even for Llama-3-8B. The hard part is approximating the non-linear functions well enough without spending too much depth, and doing it fast. The best reported CKKS LLM inference is still about 10⁴ times slower than plaintext on the same GPUs.</p>`,
()=>`<p>The card summarises how CKKS handled each half of the neuron. Later lessons fill in the same rows for the same inputs:</p>
<ul><li><b>BFV/BGV</b> compute z exactly on integers (x scaled by 10), but ReLU is even harder.</li>
<li><b>TFHE</b> evaluates ReLU exactly through a lookup table but packs only one value per ciphertext.</li>
<li><b>Paillier</b> can do the linear part with additions only and cannot do ReLU at all.</li>
<li><b>Gentry–Lee</b> encrypts whole matrices, so the rotate-and-add step disappears.</li></ul>`
];

const cfg={ id:"ckks", title:"CKKS Step by Step", compute, setup:()=>C.keygen(),
  inputNote:"Change x and every ciphertext is recomputed. Keep |z| ≤ 1 so ReLU stays accurate.",
  status:{budgetLabel:"Levels left", budgetCells:4, scaleLabel:"Scale"},
  footer:'Real toy CKKS in your browser: N = 4, Δ = 2²⁰, q = 2⁹⁰ with levels at 2³⁰, 2⁵⁰, 2⁷⁰, 2⁹⁰, key-switching modulus 2¹⁰⁰. Insecure sizes, real algebra. Scheme: Cheon, Kim, Kim, Song, <a href="https://eprint.iacr.org/2016/421">ASIACRYPT 2017</a>.',
  cardResult:()=>`${f(R.vy)} for a true ${f(R.relu)}`,
  steps };
steps.forEach((s,i)=>{ s.budget=s.lv; s.explain=EXPLAIN[i]; });
steps.push(LS.cardStep(cfg,{budget:1,scale:"—",err:()=>Math.abs(R.vy-R.relu),name:"CKKS",
  extra:()=>`<div class="next"><div><b>CKKS variants</b><br>RNS, real-only slots, safer decryption and faster bootstrapping.</div><div><b>BFV / BGV</b><br>Exact integers: z comes out exactly, but ReLU is far deeper.</div><div><b>TFHE</b><br>One value per ciphertext, but ReLU is exact by lookup table.</div><div><b>Gentry–Lee</b><br>Encrypts whole matrices, so rotate-and-add disappears.</div></div>`,
  math:()=>`<p>Toy parameters: N = 4, Δ = 2²⁰, levels q = 2³⁰, 2⁵⁰, 2⁷⁰, 2⁹⁰. Real CKKS LLM inference uses N = 2¹⁶, a modulus of about 1,500 bits split into ~60-bit primes, and bootstraps every few layers.</p>`,
  explain:EXPLAIN[8]}));
LS.start(cfg);
})();
</script>
