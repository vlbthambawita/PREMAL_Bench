<script>
(function(){
"use strict";
const {svg,tile,lock,lbl,small,arrow,pop,fade,draw,slide,blink,growX,f,fe,sup,big}=LS;
let D, L, T, PK, R;
const t=257n;
function compute(inp){
  const x=[inp.x1,inp.x2], N=LS.neuron(x);
  const xi=x.map(v=>BigInt(Math.round(v*10))), wi=[2n,-1n], bi=4n, zs=xi[0]*wi[0]+xi[1]*wi[1]+bi;
  /* DGHV */
  const d1=D.enc(xi[0]), d2=D.enc(xi[1]), dz=2n*d1.c - d2.c + bi;
  const dzDec=D.dec(dz), dzNoise=D.noiseBits(dz), pB=D.p.toString(2).length;
  const sq=[]; let c=dz, m=LS.cmod(zs,t), pred=dzNoise;
  for(let k=1;k<=4;k++){ c=c*c; m=LS.cmod(m*m,t); pred=2*pred; const dec=D.dec(c); sq.push({k,pred,ok:dec===m,dec,exp:m,cbits:c.toString(2).length}); }
  /* BV11 LWE */
  const a=L.enc(xi[0]), b=L.enc(2n), Tn=L.tensor(a,b), rl=L.relin(Tn), ms=L.modSwitch(rl);
  const lz=L.add(L.add(L.scal(L.enc(xi[0]),2n),L.scal(L.enc(xi[1]),L.q-1n)),{a:Array(L.n).fill(0n),b:bi,q:L.q});
  /* LTV */
  const l1=T.enc(xi[0]), l2=T.enc(xi[1]), lzc=T.addConst(T.add(T.scal(l1,2n),T.scal(l2,-1n)),bi), lp=T.mul(l1,T.enc(2n));
  /* packing */
  const va=[1,2,3,4], vb=[5,6,7,8], pa=PK.encode(va), pb=PK.encode(vb), pc=PK.mul(pa,pb), dc=PK.decode(pc);
  /* malleability */
  const mal=dz+1n, malDec=D.dec(mal);
  R={...N,xi,wi,bi,zs,d1,d2,dz,dzDec,dzNoise,pB,sq,a,b,Tn,rl,ms,lz,lzDec:L.dec(lz),l1,lzc,lp,ltvZ:T.dec(lzc),ltvP:T.dec(lp,2),ltvNz:T.noiseBits(lzc),ltvNp:T.noiseBits(lp,2),
     va,vb,pa,pb,pc,dc,mal,malDec,
     bv:{a:L.noiseBits(a),t:LS.bits(L.decTensor(Tn)),r:L.noiseBits(rl),m:L.noiseBits(ms),dt:LS.cmod(L.decTensor(Tn),t),dr:L.dec(rl),dm:L.dec(ms)}};
  return R;
}
const steps=[
{ key:"Timeline", who:"both", whoT:"history", at:0, budget:"—", scale:"—", err:()=>0,
  title:"Thirty years to full homomorphism",
  cap:()=>`Rivest, Adleman and Dertouzos asked for "privacy homomorphisms" in 1978. The answer came in 2009, and the schemes in this lesson turned it into the ones used today.`,
  scene(){ const ev=[[1978,"privacy homomorphisms asked for",0],[2009,"Gentry: first FHE + bootstrapping",1],[2010,"DGHV: FHE over the integers",1],[2010,"Smart–Vercauteren: SIMD slots",1],[2011,"BV11: FHE from standard LWE",1],[2012,"LTV: NTRU multi-key FHE",1],[2012,"BGV, BFV (lessons 3–4)",0],[2013,"YASHE · GSW",1],[2016,"TFHE (lesson 6)",0],[2017,"CKKS (lesson 1)",0],[2025,"CCA-secure FHE from LWE",1]];
    const x=y=>60+(y-1975)*13.2; let g=`<line x1="50" y1="150" x2="760" y2="150" stroke="currentColor" stroke-width="2" opacity=".4"/>`;
    [1980,1990,2000,2010,2020].forEach(y=>{ g+=`<line x1="${x(y)}" y1="144" x2="${x(y)}" y2="156" stroke="currentColor" opacity=".4"/>`+small(x(y),174,String(y),'text-anchor="middle"'); });
    ev.forEach(([y,t2,me],i)=>{ const up=i%2===0, yy=up?130-((i/2)%3)*30:170+(((i-1)/2)%3)*30+26; const cls=me?"c-client":"c-muted";
      g+=`<g class="tev ${cls}"><line x1="${x(y)}" y1="150" x2="${x(y)}" y2="${up?yy+6:yy-16}" stroke="currentColor" opacity=".6"/><circle cx="${x(y)}" cy="150" r="5" fill="currentColor"/><text x="${x(y)+(y>2015?-6:6)}" y="${yy}" font-size="12" text-anchor="${y>2015?"end":"start"}" fill="currentColor"${me?' font-weight="700"':""}>${y} ${t2}</text></g>`; });
    g+=small(50,300,"Bold: schemes taught in this lesson. Grey: covered in other lessons.");
    return svg(310,g,"Timeline from 1978 to 2025 of the early fully homomorphic encryption schemes."); },
  play(){ pop(".tev",0,110); },
  math:()=>`<p>Rivest, Adleman, Dertouzos, "On data banks and privacy homomorphisms" (1978). Gentry, STOC 2009. van Dijk–Gentry–Halevi–Vaikuntanathan, EUROCRYPT 2010. Smart–Vercauteren, PKC 2010. Brakerski–Vaikuntanathan, FOCS 2011. López-Alt–Tromer–Vaikuntanathan, STOC 2012. Bos–Lauter–Loftus–Naehrig 2013. Yang–Yu–Susilo, CRYPTO 2025.</p>`,
  explain:()=>`<p>Right after RSA was published, its authors noticed that RSA multiplies under encryption. They asked whether a scheme could support <i>any</i> computation on encrypted data. For thirty years every candidate supported only one operation, as the partially homomorphic lessons show.</p><p>Craig Gentry's 2009 thesis gave the first fully homomorphic construction. Within three years, a burst of follow-ups made it simpler (DGHV over the integers), parallel (Smart–Vercauteren slots), based on standard assumptions (BV11 from LWE), and efficient enough to implement (BGV and BFV).</p><p>This lesson runs small, real versions of those early ideas on our neuron. Every modern scheme in the series still uses them: noise, bootstrapping, slots, relinearization and modulus switching.</p>` },
{ key:"DGHV", who:"server", whoT:"server", at:1, budget:"noise 15 bits", scale:"integers mod t", err:()=>0,
  title:"DGHV: encryption with plain integers",
  cap:()=>`The secret is a ${R.pB}-bit odd number p. A ciphertext is m + t·r + p·q for random r, q. The server computes 2·c₁ − c₂ + 4 on huge integers, which decrypts to <b>${big(R.dzDec)}</b>.`,
  scene(){ const L2=R.dz.toString().length;
    return svg(280,`
      ${small(40,30,"c = m + t·r + p·q     (t = 257, secret p, random small r, random large q)")}
      <g class="dc">${tile(40,44,330,42,"c₁ = Enc("+R.xi[0]+"): "+R.d1.c.toString().slice(0,14)+"…","c-client","",12.5)}</g>
      <g class="dc">${tile(410,44,330,42,"c₂ = Enc("+R.xi[1]+"): "+R.d2.c.toString().slice(0,14)+"…","c-client","",12.5)}</g>
      ${arrow(390,92,390,118,"ahs","c-server")}${small(402,110,"2·c₁ − c₂ + 4  (ordinary integer arithmetic)")}
      <g class="dz">${tile(180,124,420,42,"c_z: a "+L2+"-digit integer","c-client","",13)}</g>
      ${arrow(390,172,390,198,"ahc","c-client")}${small(402,190,"(c mod p) mod t")}
      <g class="dd">${tile(180,204,200,42,"c mod p = m + t·r","c-noise","",12.5)}${tile(400,204,200,42,"mod t → "+big(R.dzDec),"c-ok","",14)}</g>
      ${small(40,270,"noise m + t·r has "+R.dzNoise+" bits, far below p's "+R.pB+" bits")}`,
      "Two DGHV ciphertexts are huge integers; the server combines them with ordinary arithmetic and the client reduces modulo p and then modulo t to get fourteen."); },
  play(){ pop(".dc",0,200); pop(".dz",700); slide(".dd",0,-20,1200,200); },
  math:()=>`<div class="formula">p = ${D.p}</div><div class="formula">c_z = 2·c₁ − c₂ + 4,   c_z mod p = ${D.noise(R.dz)}   → mod 257 = ${R.dzDec}</div><p>Adding ciphertexts adds the messages and the noises t·r. Multiplying ciphertexts multiplies them, so noise grows much faster under multiplication.</p>`,
  explain:()=>`<p>van Dijk, Gentry, Halevi and Vaikuntanathan showed that FHE needs nothing more than integers. The secret key is a large odd number p. To encrypt m, add a small multiple of t (the noise t·r) and a large random multiple of p (the mask p·q). Without p, the result looks like a random large integer. This is the approximate-GCD problem.</p><p>Decryption reduces modulo p, which strips the mask, and then modulo t, which strips the noise. Addition and multiplication of ciphertexts act on m + t·r as long as that quantity stays smaller than p. So the server computes our linear layer with ordinary big-integer arithmetic.</p><p>The original scheme encrypts bits (t = 2) with keys of millions of bits. Here t = 257 so the integer neuron fits, and p has only 100 bits.</p>` },
{ key:"Noise growth", who:"server", whoT:"server", at:1, budget:()=>R.sq.filter(s=>s.ok).length+" squarings ok", scale:"integers mod t", err:()=>0,
  title:"Each multiplication doubles the noise",
  cap:()=>`Squaring c_z repeatedly doubles the noise bits: ${R.dzNoise} → ${R.sq.map(s=>s.pred).join(" → ")}. Once the noise passes p (${R.pB} bits), decryption returns garbage. Here that happens at squaring ${(R.sq.find(s=>!s.ok)||{k:"—"}).k}.`,
  scene(){ const X0=180, sc=v=>(560*Math.min(v,160))/160, pX=X0+sc(R.pB);
    let g=small(40,30,"NOISE SIZE IN BITS AFTER EACH SQUARING (the secret p has "+R.pB+" bits)");
    const rows=[{k:0,pred:R.dzNoise,ok:true}].concat(R.sq);
    rows.forEach((s,i)=>{ const y=48+i*42; g+=`<g class="nr">${lbl(40,y+18,i?"after "+s.k+" squaring"+(s.k>1?"s":""):"c_z")}<g class="${s.ok?"c-noise":"c-warn"}"><rect class="nb" x="${X0}" y="${y}" width="${sc(s.pred)}" height="24" rx="3" fill="currentColor" fill-opacity="${s.ok?".75":".9"}"/><text x="${X0+sc(s.pred)+8}" y="${y+17}" font-size="12" fill="currentColor">${s.pred} bits ${s.ok?"✓ decrypts":"✗ wrong"}</text></g></g>`; });
    g+=`<g class="c-client"><line x1="${pX}" y1="40" x2="${pX}" y2="262" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><text x="${pX+6}" y="270" font-size="12" fill="currentColor">p (${R.pB} bits)</text></g>`;
    return svg(285,g,"Bar chart of noise bits doubling with each squaring until it crosses the size of the secret p and decryption fails."); },
  play(){ growX(".nb",0,220); },
  math:()=>`<table class="nums"><thead><tr><th>squarings</th><th>noise bits (≈ 2× previous)</th><th>decrypted</th><th>expected (40z)^(2^k) mod 257</th></tr></thead><tbody>${R.sq.map(s=>`<tr><td class="v">${s.k}</td><td class="v">${s.pred}</td><td class="v ${s.ok?"c-ok":"c-warn"}">${big(s.dec)}</td><td class="v">${big(s.exp)}</td></tr>`).join("")}</tbody></table><p>The ciphertext itself also doubles in length each time (${R.sq.map(s=>s.cbits).join(", ")} bits).</p>`,
  explain:()=>`<p>When two DGHV ciphertexts are multiplied, their noise terms multiply too. In bits, the noise doubles. Starting from about 15 bits, two squarings reach 60 bits and three reach about 120. That is beyond the 100-bit secret p. Reducing modulo p then wraps around, and the result is no longer m + t·r.</p><p>This is the problem every FHE scheme inherits. A "somewhat homomorphic" scheme can evaluate only circuits of limited multiplicative depth before the noise destroys the message. In CKKS the same budget appears as levels. In BFV it is the noise budget.</p><p>Gentry's insight, in the next step, was a way to reset the noise so the computation can continue forever.</p>` },
{ key:"Bootstrapping", who:"server", whoT:"server", at:1, budget:"refresh", scale:"—", err:()=>0,
  title:"Gentry's idea: decrypt under encryption",
  cap:()=>`The server holds an encryption of the secret key. Running the decryption circuit on the noisy ciphertext with that encrypted key gives a fresh ciphertext of the same message, with small noise.`,
  scene(){ return svg(280,`
      <g class="c-noise bs1"><rect x="40" y="70" width="170" height="60" rx="8" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-width="2"/><text x="125" y="98" text-anchor="middle" font-size="14" fill="currentColor" font-weight="700">Enc(m)</text><text x="125" y="118" text-anchor="middle" font-size="12" fill="currentColor">noise ≈ ${R.sq[1].pred} bits</text></g>
      <g class="c-client bs1"><rect x="40" y="170" width="170" height="50" rx="8" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-width="2"/><text x="125" y="200" text-anchor="middle" font-size="13" fill="currentColor">Enc(secret key)</text></g>
      ${arrow(216,100,300,140,"ahm")}${arrow(216,195,300,160,"ahm")}
      <g class="c-server bs2"><rect x="306" y="110" width="200" height="80" rx="10" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2"/><text x="406" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">evaluate Dec(·, ·)</text><text x="406" y="164" text-anchor="middle" font-size="12" fill="currentColor">homomorphically</text></g>
      ${arrow(512,150,582,150,"ahk","c-ok")}
      <g class="c-ok bs3"><rect x="588" y="120" width="170" height="60" rx="8" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-width="2"/><text x="673" y="148" text-anchor="middle" font-size="14" fill="currentColor" font-weight="700">Enc(m)</text><text x="673" y="168" text-anchor="middle" font-size="12" fill="currentColor">fresh, small noise</text></g>
      ${small(40,256,"Requires the decryption circuit itself to fit within the noise budget: Gentry had to \"squash\" it first. Circular security of Enc(sk) is assumed.")}`,
      "A noisy ciphertext and an encryption of the secret key go into a homomorphic evaluation of decryption, producing a fresh ciphertext of the same message."); },
  play(){ pop(".bs1",0,200); pop(".bs2",600); pop(".bs3",1100); },
  math:()=>`<div class="formula">Enc(m) = c  →  Enc(Dec(sk, c)) = Eval(Dec, Enc(sk), Enc(c))  = Enc(m) with fresh noise</div><p>Bootstrappable: the scheme must evaluate its own decryption circuit, plus one more operation, before the noise overflows.</p>`,
  explain:()=>`<p>Decryption removes noise, but only the client can decrypt. Gentry's way around this: give the server an <b>encryption of the secret key</b>. The server treats the noisy ciphertext as data, encrypts it (trivially), and evaluates the decryption algorithm homomorphically, with the encrypted key as the second input.</p><p>The output is an encryption of Dec(sk, c) = m, the same message. Its noise depends only on the depth of the decryption circuit, not on the history of c. If that depth is less than the scheme's budget, the server can refresh ciphertexts forever. That turns a somewhat homomorphic scheme into a fully homomorphic one.</p><p>This idea is the "bootstrapping" that costs 50–75% of the time in CKKS LLM inference (lesson 1), and that TFHE turns into a lookup-table engine (lesson 6). Its security relies on circular security: encrypting the key under itself is assumed to be safe.</p>` },
{ key:"SIMD slots", who:"client", whoT:"encoding", at:0, budget:"—", scale:"Z₁₇ slots", err:()=>0,
  title:"Smart–Vercauteren: many messages per ciphertext",
  cap:()=>`Modulo t = 17, X⁴ + 1 splits into four linear factors, so one polynomial holds four independent values. Multiplying polynomials multiplies all four at once: [1,2,3,4]·[5,6,7,8] = [${R.dc.join(", ")}] mod 17.`,
  scene(){ return svg(270,`
      ${small(40,30,"SLOTS = values at the roots "+PK.roots.join(", ")+" of X⁴ + 1 mod 17")}
      ${R.va.map((v,i)=>`<g class="sa">${tile(40+i*62,44,54,42,String(v),"c-client")}</g>`).join("")}<text x="300" y="72" font-size="20" fill="currentColor" text-anchor="middle">×</text>
      ${R.vb.map((v,i)=>`<g class="sa">${tile(330+i*62,44,54,42,String(v),"c-server")}</g>`).join("")}
      ${arrow(300,96,300,122,"ahm")}${small(312,114,"one polynomial product mod (X⁴ + 1, 17)")}
      <g class="sp">${tile(180,128,240,40,"a(X) = "+LS.poly.str(R.pa),"c-client","",12)}${tile(430,128,240,40,"b(X) = "+LS.poly.str(R.pb),"c-server","",12)}</g>
      ${arrow(420,174,420,198,"ahk","c-ok")}
      ${R.dc.map((v,i)=>`<g class="sc">${tile(296+i*62,204,54,42,String(v),"c-ok")}</g>`).join("")}
      ${small(40,226,"slot-wise products mod 17:")}`,
      "Four values per polynomial; one polynomial multiplication multiplies all four slot pairs at once."); },
  play(){ pop(".sa",0,60); fade(".sp",700); pop(".sc",1200,90); },
  math:()=>`<div class="formula">X⁴ + 1 ≡ (X − 2)(X − 8)(X − 15)(X − 9)  (mod 17)</div><div class="formula">a·b = ${LS.poly.str(R.pc)}  → evaluated at the roots: [${R.dc.join(", ")}]</div><p>By the Chinese remainder theorem Z₁₇[X]/(X⁴ + 1) ≅ Z₁₇⁴, so ring operations act slot-wise. This step shows the encoding only, which needs no encryption.</p>`,
  explain:()=>`<p>Smart and Vercauteren noticed that when the polynomial modulus splits into factors modulo t, the Chinese remainder theorem turns one plaintext polynomial into several independent "slots". Adding or multiplying polynomials then adds or multiplies every slot in parallel: single instruction, multiple data.</p><p>Here t = 17 and X⁴ + 1 splits into four linear factors. The slots are simply the polynomial's values at the four roots. Gentry and Halevi's early implementation could not use this. Smart and Vercauteren (2011) showed how to keep it, and BGV and BFV made it standard.</p><p>CKKS uses the same idea over the complex numbers instead of Z_t (lesson 1, step 2). It is why one CKKS ciphertext can carry 32,768 values of an LLM layer.</p>` },
{ key:"BV11 relin", who:"server", whoT:"server", at:1, budget:"depth 1 used", scale:"mod q (41 bits)", err:()=>0,
  title:"BV11: multiply LWE ciphertexts, then relinearize",
  cap:()=>`Multiplying two LWE ciphertexts gives a quadratic in the secret (${R.Tn?Object.keys(R.Tn.quad).length:0} terms sᵢsⱼ). Relinearization uses ${L.rlkSize} published encryptions of sᵢsⱼ·2ᵏ to turn it back into a normal ciphertext of <b>${big(R.bv.dr)}</b> = 15·2.`,
  scene(){ return svg(290,`
      ${small(40,30,"LWE: b = ⟨a, s⟩ + t·e + m mod q,  n = "+L.n+",  q ≈ 2⁴⁰,  t = 257")}
      <g class="lw">${tile(40,44,200,42,"Enc(15): noise "+R.bv.a+" bits","c-client","",13)}</g><text x="258" y="71" font-size="18" fill="currentColor">×</text><g class="lw">${tile(278,44,200,42,"Enc(2)","c-client","",13)}</g>
      ${arrow(260,92,260,118,"ahs","c-server")}${small(272,110,"tensor product")}
      <g class="tq">${tile(40,124,440,42,"c₀ + Σ cᵢ·sᵢ + Σ cᵢⱼ·sᵢsⱼ   ("+(1+L.n+Object.keys(R.Tn.quad).length)+" terms)","c-noise","",13)}</g>
      ${arrow(260,172,260,198,"ahs","c-server")}${small(272,190,"relinearize with Enc(sᵢsⱼ·2ᵏ)")}
      <g class="rl">${tile(40,204,440,42,"(a′, b′) = Enc("+R.bv.dr+"), noise "+R.bv.r+" bits","c-ok","",13)}</g>
      <g class="c-server">${LS.keyIcon(540,100)}${small(580,96,"relinearization key:")}${small(580,112,L.rlkSize+" LWE ciphertexts")}${small(580,128,"(n(n+1)/2 pairs × "+L.logq+" bits)")}</g>`,
      "Two LWE ciphertexts are multiplied into a quadratic expression in the secret key, which relinearization with published key encryptions turns back into an ordinary ciphertext of thirty."); },
  play(){ pop(".lw",0,150); pop(".tq",600); pop(".rl",1200); },
  math:()=>`<div class="formula">φ(c) = b − ⟨a, s⟩ = m + t·e;   φ₁·φ₂ = b₁b₂ − b₁⟨a₂,s⟩ − b₂⟨a₁,s⟩ + Σᵢⱼ a₁ᵢa₂ⱼ·sᵢsⱼ</div><div class="formula">tensor decrypts (with sᵢsⱼ known) to ${R.bv.dt};   after relinearization: ${R.bv.dr}   noise ${R.bv.t} → ${R.bv.r} bits</div><p>Relinearization writes each coefficient cᵢⱼ in binary and adds the matching encryptions of sᵢsⱼ·2ᵏ (Brakerski–Vaikuntanathan, FOCS 2011).</p>`,
  explain:()=>`<p>Brakerski and Vaikuntanathan built FHE from the standard Learning With Errors problem. A ciphertext is (a, b) with b = ⟨a, s⟩ + t·e + m. Adding ciphertexts is easy. Multiplying them is the problem: the product of two "phases" b − ⟨a, s⟩ is a quadratic polynomial in the secret, with a term for every pair sᵢsⱼ.</p><p><b>Relinearization</b> fixes this. The client publishes encryptions of every sᵢsⱼ, scaled by powers of two. The server splits each quadratic coefficient into bits and adds the matching encryptions, which replaces each sᵢsⱼ term by an ordinary linear ciphertext. The result decrypts to 30 = 15 × 2 with only modestly more noise.</p><p>The same step, done with a ring and a single key-switching key, is the relinearization in CKKS and BFV.</p>` },
{ key:"Mod switch", who:"server", whoT:"server", at:1, budget:"noise reset", scale:"mod q′ (21 bits)", err:()=>0,
  title:"Modulus switching shrinks the noise",
  cap:()=>`Scaling the ciphertext from q ≈ 2⁴⁰ down to q′ ≈ 2²⁰, while keeping every number's value mod t, divides the noise too: ${R.bv.r} bits → <b>${R.bv.m} bits</b>, still decrypting to ${big(R.bv.dm)}.`,
  scene(){ const X0=200, sc=v=>v*12;
    return svg(240,`
      ${small(40,30,"NOISE (BITS) AND MODULUS (BITS)")}
      ${lbl(40,66,"before, mod q")}<g class="c-noise"><rect class="mb" x="${X0}" y="50" width="${sc(R.bv.r)}" height="24" rx="3" fill="currentColor"/></g><g class="c-client"><rect class="mb" x="${X0}" y="80" width="${sc(L.q.toString(2).length)}" height="12" rx="3" fill="currentColor" fill-opacity=".4"/></g>${small(X0+sc(L.q.toString(2).length)+8,90,"q: "+L.q.toString(2).length+" bits")}${small(X0+sc(R.bv.r)+8,66,"noise "+R.bv.r+" bits")}
      ${lbl(40,146,"after, mod q′")}<g class="c-noise"><rect class="mb" x="${X0}" y="130" width="${sc(R.bv.m)}" height="24" rx="3" fill="currentColor"/></g><g class="c-client"><rect class="mb" x="${X0}" y="160" width="${sc(L.q2.toString(2).length)}" height="12" rx="3" fill="currentColor" fill-opacity=".4"/></g>${small(X0+sc(L.q2.toString(2).length)+8,170,"q′: "+L.q2.toString(2).length+" bits")}${small(X0+sc(R.bv.m)+8,146,"noise "+R.bv.m+" bits")}
      ${small(40,214,"The next multiplication now starts from "+R.bv.m+"-bit noise instead of "+R.bv.r+": noise grows additively per level instead of doubling.")}`,
      "Bars comparing noise and modulus sizes before and after modulus switching; both shrink by about twenty bits."); },
  play(){ growX(".mb",0,150); },
  math:()=>`<div class="formula">x′ = round(x · q′/q), then nudge by at most t/2 so that x′ ≡ x (mod t);   q ≡ q′ ≡ 1 (mod t)</div><div class="formula">q = ${L.q},  q′ = ${L.q2};   decrypts to ${R.bv.dm}</div><p>This is the core of BGV's "leveled FHE without bootstrapping": a ladder of moduli, switched down after each multiplication. CKKS's rescaling (lesson 1, step 4) is its approximate-arithmetic cousin.</p>`,
  explain:()=>`<p>Brakerski, Gentry and Vaikuntanathan noticed that dividing a ciphertext by a large factor divides its noise by the same factor. The message survives, provided every coefficient is rounded to a nearby value that keeps its residue modulo t.</p><p>After the multiplication above, the noise is ${R.bv.r} bits in a ${L.q.toString(2).length}-bit modulus. Switching to a 21-bit modulus gives about ${R.bv.m} bits of noise. The ratio of noise to modulus barely changes, but the absolute noise is small again. The next multiplication squares a small number instead of a large one, so noise grows linearly with depth instead of exponentially.</p><p>That gives a ladder of moduli, one rung per multiplication: the "levels" of BGV and CKKS. With enough rungs, many circuits run without bootstrapping at all.</p>` },
{ key:"LTV / YASHE", who:"server", whoT:"server", at:1, budget:"1 multiplication", scale:"mod q (62 bits)", err:()=>0,
  title:"NTRU-based FHE: LTV and YASHE",
  cap:()=>`The public key is h = t·g/f in a ring. Ciphertexts are single polynomials. The linear part decrypts to <b>${big(R.ltvZ)}</b>, and one product decrypts with f² to ${big(R.ltvP)}. Large moduli made these schemes breakable.`,
  scene(){ return svg(280,`
      ${small(40,30,"R_q = Z_q[X]/(X⁸ + 1),  f = 1 + t·f′ (small),  h = t·g·f⁻¹,  Enc(m) = h·s + t·e + m")}
      <g class="lt">${tile(40,44,330,42,"public h: "+LS.hex(T.h[0],T.q,4)+", "+LS.hex(T.h[1],T.q,4)+", …","c-server","",12.5)}</g>
      <g class="lt">${tile(410,44,330,42,"secret f = "+LS.poly.str(T.f.map(v=>LS.cmod(v,T.q))).slice(0,30)+"…","c-client","",12)}</g>
      <g class="lt2">${tile(40,110,330,42,"2·c₁ − c₂ + 4  →  f·c mod t = "+big(R.ltvZ),"c-ok","",13)}</g>
      <g class="lt2">${tile(410,110,330,42,"c₁·Enc(2)  →  f²·c mod t = "+big(R.ltvP),"c-ok","",13)}</g>
      ${small(40,178,"noise: "+R.ltvNz+" bits after the linear part, "+R.ltvNp+" bits after one product (q has "+T.q.toString(2).length+" bits)")}
      <g class="c-warn att">${lbl(40,218,"Overstretched NTRU: when q is huge compared with f and g, lattice reduction on the subfield recovers the key","font-weight=\"700\"")}${small(40,238,"(Albrecht–Bai–Ducas, CRYPTO 2016; Kirchner–Fouque, EUROCRYPT 2017). FHE needs huge q, so LTV/YASHE parameters fell.")}</g>`,
      "NTRU-based public key and secret key; the linear part and one product decrypt correctly; a warning explains the overstretched NTRU attack."); },
  play(){ pop(".lt",0,200); pop(".lt2",700,200); blink(".att",1400); },
  math:()=>`<div class="formula">f·c = t·g·s + t·f·e + f·m ≡ m (mod t)   because f ≡ 1 (mod t)</div><div class="formula">q = ${T.q}</div><p>Multi-key: ciphertexts under different keys multiply into one that decrypts with f₁·f₂, which is LTV's "on-the-fly" multiparty computation (STOC 2012).</p>`,
  explain:()=>`<p>López-Alt, Tromer and Vaikuntanathan built FHE on NTRU. The secret is a small polynomial f ≡ 1 mod t, and the public key is h = t·g/f. A ciphertext is a single polynomial h·s + t·e + m, half the size of an RLWE ciphertext. Multiplying f into it cancels the division and leaves m plus small multiples of t.</p><p>The scheme has a striking feature. Ciphertexts under <i>different</i> users' keys can be multiplied, and the result decrypts with the product of the keys. That made LTV the first multi-key FHE (lesson 12). YASHE (Bos, Lauter, Loftus, Naehrig) combined NTRU and RLWE ideas into one of the fastest schemes of 2013.</p><p>Both relied on NTRU with a very large modulus q relative to f and g. In 2016–2017, subfield and lattice-reduction attacks showed that such "overstretched" NTRU is weak, and the parameters FHE needs fall inside the broken regime. Modern NTRU-based FHE (FINAL, lesson 7) uses small moduli only for bootstrapping.</p>` },
{ key:"CCA", who:"server", whoT:"attacker", at:1, budget:"—", scale:"—", err:()=>0,
  title:"Malleable by design: why FHE is only CPA-secure",
  cap:()=>`Anyone can change an FHE ciphertext meaningfully: adding 1 to DGHV's c_z turns ${big(R.dzDec)} into <b>${big(R.malDec)}</b>. So FHE can never be CCA2-secure. It is only safe when decryption results are not leaked back.`,
  scene(){ return svg(260,`
      <g class="cc">${tile(40,50,240,46,"Enc("+big(R.dzDec)+")","c-client","",15)}</g>
      ${arrow(288,73,388,73,"ahw","c-warn")}${small(338,62,"+ 1",'text-anchor="middle"')}
      <g class="cc2">${tile(396,50,240,46,"Enc("+big(R.malDec)+")","c-warn","",15)}</g>
      ${small(40,140,"CPA:  attacker sees ciphertexts only → FHE schemes are secure (RLWE, LWE, AGCD …)")}
      ${small(40,162,"CCA1: attacker may decrypt chosen ciphertexts before the challenge → needs special constructions (2025–2026)")}
      ${small(40,184,"CCA2: decryption oracle after the challenge → impossible: homomorphism itself is malleability")}
      <g class="c-client">${small(40,222,"SoK threat model: the server is semi-honest and the client never returns decrypted results, so CPA security suffices.")}</g>`,
      "Adding one to a ciphertext changes the encrypted value from fourteen to fifteen, illustrating malleability; text compares CPA, CCA1 and CCA2 security."); },
  play(){ pop(".cc",0); slide(".cc2",-60,0,500); },
  math:()=>`<div class="formula">Dec(c_z + 1) = ${R.malDec} = Dec(c_z) + 1</div><p>CCA-secure FHE: Yang, Yu, Susilo (CRYPTO 2025; ePrint 2026/1756) achieve CCA security for 1-hop FHE from circular-secure LWE. GG-GSW (ePrint 2026/316) gives IND-CCA1 leveled FHE from gadget trapdoors. For CKKS, sharing decryptions breaks even CPA security (IND-CPA-D attack, lesson 2).</p>`,
  explain:()=>`<p>The property that makes FHE useful, transforming a ciphertext into another meaningful ciphertext, is exactly what chosen-ciphertext security forbids. If an attacker can turn Enc(14) into Enc(15) and then get it decrypted, the scheme cannot be CCA2-secure. So FHE schemes are proven secure against chosen-<i>plaintext</i> attacks only.</p><p>That is fine in the SoK's model. The server is honest-but-curious, and only the client ever decrypts. It becomes dangerous when decrypted results flow back to the server. For CKKS, even that breaks CPA security: the Li–Micciancio attack recovers the key from shared approximate decryptions (lesson 2).</p><p>Recent work narrows the gap. Yang, Yu and Susilo built 1-hop FHE with chosen-ciphertext security from LWE, and GG-GSW achieves CCA1 with a light change to GSW. Both are early, theoretical constructions.</p>` }
];
