<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Function Secret Sharing Step by Step</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson.css">
</head>
<body>
<div id="app"></div>
<script src="lessons.js"></script>
<script src="cards/fss.js"></script>
<script src="lesson.js"></script>
<script src="engines/sha256.js"></script>
<script src="engines/mpc.js"></script>
<script src="engines/fss.js"></script>
<script>
(function(){
"use strict";
const {svg,tile,lbl,small,pop,fade,draw,slide,blink,growX,f,fe}=LS;
const M=MPC, h8=v=>(v>>>0).toString(16).padStart(8,"0"), sg=M.signed, N=6;
const P0C="c-ok", P1C="c-muted";
let R;
function compute(inp){
  const X=[Math.round(inp.x1*10),Math.round(inp.x2*10)], zt=X[0]*2-X[1]+4;
  const zs=M.share(zt);
  // dealer (offline)
  const r=LS.randInt(0,63), rs=M.share(r), a1=r, a2=(r+32)%64, cst=r>=32?1:0;
  const KA=FSS.dcfGen(N,a2,1), KB=FSS.dcfGen(N,a1,1);
  const naive=FSS.naive(N,u=>(((u-r)%64+64)%64)<32?1:0);
  // online: open masked input
  const ub=[0,1].map(b=>(M.add(zs[b],rs[b]))&63), u=(ub[0]+ub[1])&63;
  const evA=[0,1].map(b=>FSS.dcfEval(KA[b],u)), evB=[0,1].map(b=>FSS.dcfEval(KB[b],u));
  const g=[0,1].map(b=>FSS.add(FSS.sub(evA[b].V,evB[b].V),b===0?cst:0)), pos=FSS.add(g[0],g[1]);
  M.reset(); const fin=M.mulMany([[zs,g]],"z·pos"); const y=sg(M.open(fin.out[0]));
  // comparison baseline: ripple-carry rounds from lesson 17's method
  M.reset(); M.a2bSign(M.share(zt)); const ssRounds=M.rounds+2;
  const z6=((zt%64)+64)%64, zsigned=z6>=32?z6-64:z6;
  const kb=FSS.keyBytes(KA[0]), kb32=16+32*21+4;
  R={X,zt,zsigned,x:[inp.x1,inp.x2],zs,r,rs,a1,a2,cst,KA,KB,naive,ub,u,evA,evB,g,pos,fin,y,yv:y/40,relu:Math.max(0,zt)/40,ssRounds,kb,kb32};
  return R;
}
const box=(x,y,w,h,cls,title,sub)=>`<g class="${cls}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9" fill="currentColor" fill-opacity=".07" stroke="currentColor" stroke-width="2"/><text x="${x+12}" y="${y+22}" font-size="13" font-weight="700" fill="currentColor">${title}</text>${sub?`<text x="${x+12}" y="${y+40}" font-size="11.5" fill="currentColor" class="c-muted">${sub}</text>`:""}</g>`;
const mk=c=>c==="c-ok"?"ahk":c==="c-muted"?"ahm":c==="c-client"?"ahc":c==="c-server"?"ahs":"ahn";
const arr=(x1,y1,x2,y2,cls,label,lx,ly)=>`<g class="${cls} msg"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-width="2" marker-end="url(#${mk(cls)})"/>${label?`<text x="${lx}" y="${ly}" font-size="12" text-anchor="middle" fill="currentColor">${label}</text>`:""}</g>`;
const strip=(y,vals,cls,lab,mode,hl)=>{ const W=10; let g=small(110,y+13,lab,'text-anchor="end"');
  vals.forEach((v,u)=>{ const op=mode==="bit"?(v?0.75:0.06):(0.08+0.8*(v/4294967296)); g+=`<g class="${cls}"><rect x="${120+u*W}" y="${y}" width="${W-2}" height="18" rx="2" fill="currentColor" fill-opacity="${op.toFixed(2)}" ${u===hl?'stroke="currentColor" stroke-width="2"':""}/></g>`; }); return g; };
const rounds=n=>n===1?"1 round":n+" rounds";

const steps=[
{ key:"Example", who:"both", whoT:"the task", at:0.5, budget:"0 rounds", scale:"6-bit inputs", err:()=>"exact",
  title:"One comparison, one round",
  cap:()=>`z is secret-shared between two servers, as at the end of lesson 17's linear part: 40·z = ${R.zt}. ReLU needs the bit [z ≥ 0]. FSS gets it with one round instead of ${R.ssRounds-2}.`,
  scene(){ return svg(320,`
    ${box(300,20,200,80,"c-noise","Dealer (offline)","random mask r, FSS keys")}
    ${box(40,150,220,110,P0C,"Server P0","share z₀ = "+h8(R.zs[0]))}
    ${box(540,150,220,110,P1C,"Server P1","share z₁ = "+h8(R.zs[1]))}
    ${arr(330,104,220,146,"c-noise","key k₀",250,118)}${arr(470,104,580,146,"c-noise","key k₁",550,118)}
    ${arr(264,190,534,190,P0C,"u₀ = z₀ + r₀ (masked)",400,182)}${arr(536,226,266,226,P1C,"u₁ = z₁ + r₁ (masked)",400,248)}
    ${small(400,296,"after one exchange both servers know u = z + r mod 64 and evaluate their keys locally",'text-anchor="middle"')}
    <g class="c-ok"><rect x="20" y="300" width="10" height="10" rx="2" fill="currentColor"/></g>${small(36,309,"P0")}<g class="c-muted"><rect x="64" y="300" width="10" height="10" rx="2" fill="currentColor"/></g>${small(80,309,"P1")}`,
    "A dealer gives each of two servers an FSS key offline; online the servers exchange one masked value."); },
  play(){ pop("g.c-noise,g.c-ok,g.c-muted",0,120); fade(".msg",500,200); },
  math:()=>`<div class="formula">40·z = ${R.X[0]}·2 + ${R.X[1]}·(−1) + 4 = ${R.zt}</div><div class="formula">z₀ + z₁ mod 2³² = ${sg(M.open(R.zs))}</div><p>The comparison works on the low 6 bits, so 40·z must stay between −32 and 31.</p>`,
  explain:()=>`<p>Lesson 17 needed 31 sequential rounds to learn the sign of a shared number. Function secret sharing (Boyle, Gilboa and Ishai, 2015) moves almost all of that work into an offline phase.</p>
<p>Instead of sharing a number, the dealer shares a function. Each server gets a key. Evaluating the key on a public input gives a share of the function's output, and the two shares add up to the true output. Neither key alone reveals the function.</p>
<p>The public input is the masked value u = z + r, opened in one round. The function is "is u − r non-negative?", with the secret r baked into the keys. This is how SIGMA (PETS 2024) runs GPT-style models with GPU-friendly FSS.</p>` },
{ key:"Naive keys", who:"both", whoT:"dealer", at:0.5, budget:"0 rounds", scale:"64 inputs", err:()=>"exact",
  title:"Sharing a function the naive way: two random tables",
  cap:()=>`Write the function g(u) as a table over all 64 inputs, then split the table into two random tables K₀, K₁ with K₀[u] + K₁[u] = g(u). Correct, but each key is as large as the domain.`,
  scene(){ return svg(260,`
    ${strip(30,R.naive.T,"c-noise","g(u) = [u − r ≥ 0]","bit",R.u)}
    ${strip(80,R.naive.K0,P0C,"key K₀ (P0)","val",R.u)}
    ${strip(130,R.naive.K1,P1C,"key K₁ (P1)","val",R.u)}
    ${small(120,175,"u = 0")}${small(760,175,"63",'text-anchor="end"')}
    <g class="c-client"><line x1="${120+R.u*10+4}" y1="22" x2="${120+R.u*10+4}" y2="160" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"/><text x="${Math.min(470,120+R.u*10+10)}" y="200" font-size="12.5" class="mono" fill="currentColor">at u = ${R.u}: ${h8(R.naive.K0[R.u])} + ${h8(R.naive.K1[R.u])} = ${FSS.add(R.naive.K0[R.u],R.naive.K1[R.u])}</text></g>
    ${small(120,234,"key size: 64 × 4 bytes = 256 B per key. For 32-bit inputs this would be 16 GiB.")}`,
    "Three strips of 64 cells: the step function, and two random-looking key tables whose sum at any position equals the step function."); },
  play(){ fade("g rect",0,4); },
  math:()=>`<div class="formula">K₀[u] uniform,   K₁[u] = g(u) − K₀[u] mod 2³²</div><div class="formula">K₀[${R.u}] + K₁[${R.u}] = ${h8(R.naive.K0[R.u])} + ${h8(R.naive.K1[R.u])} = ${FSS.add(R.naive.K0[R.u],R.naive.K1[R.u])} = g(${R.u})</div>`,
  explain:()=>`<p>The simplest function secret sharing is to secret-share the function's entire truth table, entry by entry. Each table alone is uniformly random, so a server learns nothing about the function, including where the step is.</p>
<p>This already gives a one-round comparison: open the masked input and look up your entry. The problem is size. Each key holds one number per possible input, which is fine for 6 bits and impossible for 32.</p>
<p>The breakthrough of FSS is to compress such keys to roughly one seed plus a few correction words per input bit, using a pseudorandom generator. The next steps build up to that.</p>` },
{ key:"Mask", who:"both", whoT:"dealer", at:0.5, budget:"0 rounds", scale:"mod 64", err:()=>"exact",
  title:"Hide z behind a random mask r",
  cap:()=>`The dealer picks r = ${R.r}. Then z ≥ 0 exactly when u = z + r lands in the green arc [r, r + 32). The servers will see u, which is uniformly random.`,
  scene(){ const cx=400, cy=165, rad=120, pt=k=>{ const a=-Math.PI/2+2*Math.PI*k/64; return [cx+rad*Math.cos(a), cy+rad*Math.sin(a)]; };
    let g="";
    for(let k=0;k<64;k++){ const [x,y]=pt(k), on=(((k-R.r)%64+64)%64)<32; g+=`<g class="${on?"c-ok":"c-muted"} dot"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${on?5:3.5}" fill="currentColor" fill-opacity="${on?.85:.5}"/></g>`; }
    const [rx,ry]=pt(R.r), [ux,uy]=pt(R.u);
    g+=`<g class="c-noise"><line x1="${cx}" y1="${cy}" x2="${rx.toFixed(1)}" y2="${ry.toFixed(1)}" stroke="currentColor" stroke-width="2"/><text x="${(cx+(rx-cx)*1.25).toFixed(1)}" y="${(cy+(ry-cy)*1.25+4).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">r = ${R.r}</text></g>`;
    g+=`<g class="c-client mk"><circle cx="${ux.toFixed(1)}" cy="${uy.toFixed(1)}" r="10" fill="none" stroke="currentColor" stroke-width="3"/><text x="${(cx+(ux-cx)*1.3).toFixed(1)}" y="${(cy+(uy-cy)*1.3+4).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">u = ${R.u}</text></g>`;
    g+=`<text x="${cx}" y="${cy+40}" text-anchor="middle" font-size="13" fill="currentColor">z = u − r</text><text x="${cx}" y="${cy+60}" text-anchor="middle" font-size="13" class="mono" fill="currentColor">= ${R.u} − ${R.r} ≡ ${R.zsigned}</text>`;
    g+=small(40,40,"64 positions of u (mod 64)")+`<g class="c-ok"><text x="620" y="60" font-size="12.5" fill="currentColor">green: u − r ∈ [0, 32) → z ≥ 0</text></g><g class="c-muted"><text x="620" y="82" font-size="12.5" fill="currentColor">grey: z &lt; 0</text></g>`;
    return svg(330,g,"A dial of 64 positions with a green half-circle starting at the mask r; the masked input u falls in the green half exactly when z is non-negative."); },
  play(){ fade(".dot",0,12); pop(".mk",900); },
  math:()=>`<div class="formula">g(u) = [ (u − r) mod 64 &lt; 32 ] = [u &lt; r + 32] − [u &lt; r] + [r ≥ 32]</div><p>With r = ${R.r}: α₁ = ${R.a1}, α₂ = ${R.a2}, constant ${R.cst}. Each bracket [u &lt; α] is one distributed comparison function (DCF), so the dealer issues two DCF keys per server.</p>`,
  explain:()=>`<p>The servers cannot open z itself, but they can open z + r for a random r that only the dealer knows. Because r is uniform, u = z + r is uniform too and reveals nothing about z.</p>
<p>The dealer then shares the function that answers "was z non-negative?" in terms of u. On a circle of 64 positions, that is a half-circle starting at r. Writing it as two "less than" tests makes it a difference of two comparison functions, each of which FSS handles directly.</p>
<p>The mask r is fresh for every comparison. Each ReLU in a model consumes one set of keys, which the dealer prepares offline, much like Beaver triples.</p>` },
{ key:"Tree keys", who:"both", whoT:"dealer", at:0.5, budget:"0 rounds", scale:"PRG tree", err:()=>"exact",
  title:"Compress the key with a PRG tree (DCF)",
  cap:()=>`Each DCF key is a short random seed plus one correction word per level of a binary tree. Expanding the seed along the path of u reproduces the table entry. Key size: ${R.kb} B instead of 256 B.`,
  scene(){ const levels=N+1, Y=l=>40+l*40, X=(l,i)=>40+(i+0.5)*(720/(1<<l));
    const path=x=>Array.from({length:levels},(_,l)=>x>>(N-l));
    const pa=path(R.a1), pu=path(R.u);
    let g="";
    for(let l=0;l<levels;l++){ const n=1<<l; for(let i=0;i<n;i++){ const onA=pa[l]===i, onU=pu[l]===i; if(!onA&&!onU) g+=`<g class="c-muted"><circle cx="${X(l,i).toFixed(1)}" cy="${Y(l)}" r="${l<5?4:2.5}" fill="currentColor" fill-opacity=".35"/></g>`; } }
    const line=(p,cls,m)=>{ let d=""; for(let l=1;l<levels;l++){ d+=`<line x1="${X(l-1,p[l-1]).toFixed(1)}" y1="${Y(l-1)}" x2="${X(l,p[l]).toFixed(1)}" y2="${Y(l)}" stroke="currentColor" stroke-width="3"/>`; } return `<g class="${cls} pth">${d}</g>`; };
    g+=line(pa,"c-noise")+line(pu,"c-client");
    for(let l=0;l<levels;l++){ g+=`<g class="c-noise"><circle cx="${X(l,pa[l]).toFixed(1)}" cy="${Y(l)}" r="6" fill="currentColor"/></g><g class="c-client"><circle cx="${X(l,pu[l]).toFixed(1)}" cy="${Y(l)}" r="5" fill="var(--panel)" stroke="currentColor" stroke-width="3"/></g>`; if(l>0) g+=small(780,Y(l)+4,"CW"+LS.sub(l),'text-anchor="end"'); }
    g+=small(780,Y(0)+4,"seed",'text-anchor="end"');
    g+=small(40,308,"the two paths share their first levels where α₁ and u have the same leading bits")+`<g class="c-noise"><text x="40" y="330" font-size="12.5" fill="currentColor">dealer's secret threshold α₁ = ${R.a1} (path baked into the correction words)</text></g><g class="c-client"><text x="40" y="350" font-size="12.5" fill="currentColor">evaluation path of the public u = ${R.u}</text></g>`;
    return svg(362,g,"A binary tree of depth six; the dealer's secret threshold path and the evaluation path of u are highlighted, with one correction word per level."); },
  play(){ fade("circle",0,4); draw(".pth line",500,300); },
  math:()=>{ const k=R.KB[0]; return `<table class="nums"><thead><tr><th>level</th><th>seed correction</th><th>value correction</th><th>t corrections</th></tr></thead><tbody>${k.CW.map((c,i)=>`<tr><td>${i+1}</td><td class="v">${FSS.hexSeed(c.scw)}</td><td class="v">${h8(c.Vcw)}</td><td>${c.tLcw}${c.tRcw}</td></tr>`).join("")}</tbody></table>
    <p>Key = 16-byte seed + ${N} × (16 + 4 + 1) B + 4 B = ${R.kb} B. For 32-bit inputs: ${R.kb32} B, versus 16 GiB for a table. The PRG is SHA-256(seed ‖ 0) and SHA-256(seed ‖ 1).</p>`; },
  explain:()=>`<p>A distributed comparison function key works like a compressed table. Each server starts from its own random seed at the root of a binary tree with one level per input bit. A pseudorandom generator expands a seed into two child seeds plus a small value.</p>
<p>The two servers' seeds start different. Correction words, identical in both keys, are added along the way. They make the two servers' seeds agree, and so cancel out, everywhere off the dealer's secret path, while keeping them different on it. Along the walk each server accumulates value shares whose sum is 1 exactly when the walk leaves the secret path towards smaller numbers.</p>
<p>This construction is from Boyle, Chandran, Gilboa, Gupta, Ishai, Kumar and Rathee (EUROCRYPT 2021). Evaluation costs one PRG call per input bit, about 12 SHA-256 calls here, and AES on GPUs in SIGMA. The engine was checked exhaustively: for random thresholds, the two keys add up to the right answer at all 64 inputs.</p>` },
{ key:"Open u", who:"server", whoT:"two servers", at:1, budget:"1 round", scale:"mod 64", err:()=>"exact",
  title:"Online: open the masked input in one round",
  cap:()=>`Each server adds its share of r to its share of z and sends the result. Both now know u = ${R.u}, which tells them nothing about z.`,
  scene(){ return svg(260,`
    ${box(40,40,240,170,P0C,"Server P0","z₀ + r₀ mod 64")}${box(520,40,240,170,P1C,"Server P1","z₁ + r₁ mod 64")}
    <g class="${P0C}"><text x="60" y="120" font-size="15" class="mono" fill="currentColor">u₀ = ${R.ub[0]}</text></g><g class="${P1C}"><text x="540" y="120" font-size="15" class="mono" fill="currentColor">u₁ = ${R.ub[1]}</text></g>
    ${arr(284,100,514,100,P0C,"u₀",400,92)}${arr(516,150,286,150,P1C,"u₁",400,172)}
    <g class="c-client big"><text x="400" y="235" text-anchor="middle" font-size="18" class="mono" fill="currentColor">u = ${R.ub[0]} + ${R.ub[1]} mod 64 = ${R.u}</text></g>`,
    "Both servers send their masked shares to each other and reconstruct u."); },
  play(){ slide(".msg",-40,0,0,250); pop(".big",800); },
  math:()=>`<div class="formula">u_b = (z_b + r_b) mod 64,   u = u₀ + u₁ mod 64 = z + r mod 64 = ${R.u}</div><p>Because 64 divides 2³², reducing each 32-bit share mod 64 keeps the sum correct.</p>`,
  explain:()=>`<p>This is the only interactive step of the comparison. Each server sends one 6-bit number. In a real model, all comparisons of a layer are opened together in the same round.</p>
<p>Seeing u is safe because r is uniform and used once. The servers know u but not r, and r is exactly what they would need to recover z.</p>` },
{ key:"Evaluate", who:"server", whoT:"two servers", at:1, budget:"1 round", scale:"mod 2³²", err:()=>"exact",
  title:"Evaluate the keys locally: shares of [z ≥ 0]",
  cap:()=>`Each server evaluates its two DCF keys at u and combines them. The results look random, but they add up to ${R.pos}: z is ${R.pos?"non-negative":"negative"}.`,
  scene(){ const col=(x,cls,b)=>`<g class="${cls} col"><text x="${x}" y="80" font-size="13" class="mono" fill="currentColor">[u &lt; α₂]: ${h8(R.evA[b].V)}</text><text x="${x}" y="110" font-size="13" class="mono" fill="currentColor">− [u &lt; α₁]: ${h8(R.evB[b].V)}</text><text x="${x}" y="140" font-size="13" class="mono" fill="currentColor">+ constant: ${b===0?R.cst:0}</text><line x1="${x}" y1="152" x2="${x+230}" y2="152" stroke="currentColor"/><text x="${x}" y="176" font-size="14" font-weight="700" class="mono" fill="currentColor">g${LS.sub(b)} = ${h8(R.g[b])}</text></g>`;
    return svg(280,`
      <g class="${P0C}"><text x="60" y="44" font-size="14" font-weight="700" fill="currentColor">Server P0</text></g><g class="${P1C}"><text x="440" y="44" font-size="14" font-weight="700" fill="currentColor">Server P1</text></g>
      ${col(60,P0C,0)}${col(440,P1C,1)}
      <g class="c-ok big"><rect x="250" y="206" width="300" height="44" rx="8" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-width="2"/><text x="400" y="234" text-anchor="middle" font-size="15" class="mono" fill="currentColor">g₀ + g₁ = ${R.pos} = [z ≥ 0]</text></g>`,
      "Each server combines its two key evaluations into a random-looking share; the shares add to one, meaning z is non-negative."); },
  play(){ fade(".col",0,300); pop(".big",900); },
  math:()=>`<table class="nums"><thead><tr><th></th><th>P0</th><th>P1</th><th>sum</th></tr></thead><tbody>
    <tr><td>DCF(α₂ = ${R.a2}) at u</td><td class="v">${h8(R.evA[0].V)}</td><td class="v">${h8(R.evA[1].V)}</td><td class="v">${FSS.add(R.evA[0].V,R.evA[1].V)}</td></tr>
    <tr><td>DCF(α₁ = ${R.a1}) at u</td><td class="v">${h8(R.evB[0].V)}</td><td class="v">${h8(R.evB[1].V)}</td><td class="v">${FSS.add(R.evB[0].V,R.evB[1].V)}</td></tr>
    <tr><td>g = A − B + const</td><td class="v">${h8(R.g[0])}</td><td class="v">${h8(R.g[1])}</td><td class="v">${R.pos}</td></tr></tbody></table>`,
  explain:()=>`<p>No messages are needed here. Each server walks its own key down the tree along the bits of u, using only its seed, the shared correction words and the PRG.</p>
<p>The outputs are additive shares in the same 32-bit ring used for the arithmetic. So the comparison result can go straight into the next multiplication, with no conversion between boolean and arithmetic shares. That conversion was one of the extra rounds in lesson 17.</p>` },
{ key:"ReLU", who:"client", whoT:"servers → client", at:0, budget:"2 rounds + output", scale:"÷ 40", err:()=>Math.abs(R.yv-R.relu)<1e-12?"exact":Math.abs(R.yv-R.relu),
  title:"Multiply by the comparison bit and open the result",
  cap:()=>`One Beaver multiplication computes z · [z ≥ 0] (round 2). The client adds the two output shares: <b>${R.y}</b>, so y = <b>${f(R.yv)}</b>. Exact.`,
  scene(){ const r=R.fin.rec[0]; return svg(280,`
    ${box(40,30,220,120,P0C,"Server P0","y₀ = "+h8(R.fin.out[0][0]))}${box(40,160,220,100,P1C,"Server P1","y₁ = "+h8(R.fin.out[0][1]))}
    <g class="c-noise"><text x="290" y="60" font-size="12.5" fill="currentColor">Beaver round: d = ${h8(r.d)}, e = ${h8(r.e)}</text></g>
    ${box(560,80,220,130,"c-client","Client","y₀ + y₁")}
    ${arr(264,110,556,130,P0C,"",0,0)}${arr(264,210,556,170,P1C,"",0,0)}
    <g class="c-client big"><text x="670" y="166" text-anchor="middle" font-size="30" class="mono" fill="currentColor">${R.y}</text><text x="670" y="194" text-anchor="middle" font-size="13" fill="currentColor">÷ 40 = ${f(R.yv)}</text></g>`,
    "The servers multiply z by the comparison bit with one Beaver round and send their output shares to the client, which gets 14."); },
  play(){ slide(".msg",-60,0,0,200); pop(".big",700); },
  math:()=>`<div class="formula">y = z · g = ${sg(M.open(R.zs))} · ${R.pos} = ${R.y},   ${R.y}/40 = ${f(R.yv)}   (true ReLU ${f(R.relu)})</div>`,
  explain:()=>`<p>ReLU is z multiplied by the comparison bit, so one more Beaver multiplication finishes the job. SIGMA goes further and builds ReLU, GELU and Softmax pieces directly as FSS gates, so even this multiplication is folded into the keys.</p>
<p>As with secret sharing and garbled circuits, the result is exact, with no noise and no approximation in the comparison.</p>` },
{ key:"Cost", who:"both", whoT:"comparison", at:0.5, budget:"2 rounds", scale:"bytes", err:()=>"exact",
  title:"Rounds and key sizes",
  cap:()=>`One ReLU here takes 2 online rounds, against ${R.ssRounds} with the ripple-carry adder of lesson 17. The price is offline keys of ${2*R.kb} B per server, which the dealer must prepare in advance.`,
  scene(){ const X0=280, X1=760, lg=v=>Math.log10(v), mxR=R.ssRounds, bw=(v,m)=>(X1-X0)*v/m;
    const kmax=lg(16*2**30), kb=v=>(X1-X0)*lg(v)/kmax;
    return svg(330,`
      ${lbl(40,34,"Online rounds for one ReLU","font-weight=\"700\"")}
      ${small(40,66,"secret sharing (lesson 17)")}<g class="c-muted"><rect class="bar" x="${X0}" y="50" width="${bw(R.ssRounds,mxR)}" height="24" rx="3" fill="currentColor"/></g><text x="${X0+bw(R.ssRounds,mxR)-8}" y="67" text-anchor="end" font-size="13" fill="var(--panel)" font-weight="700">${R.ssRounds}</text>
      ${small(40,104,"function secret sharing")}<g class="c-ok"><rect class="bar" x="${X0}" y="88" width="${bw(2,mxR)}" height="24" rx="3" fill="currentColor"/><text x="${X0+bw(2,mxR)+8}" y="105" font-size="13" fill="currentColor">2</text></g>
      ${lbl(40,164,"Key size per comparison (log scale)","font-weight=\"700\"")}
      ${small(40,196,"table, 6-bit input")}<g class="c-muted"><rect class="bar" x="${X0}" y="180" width="${kb(256)}" height="22" rx="3" fill="currentColor"/><text x="${X0+kb(256)+8}" y="196" font-size="12.5" fill="currentColor">256 B</text></g>
      ${small(40,228,"DCF, 6-bit input")}<g class="c-ok"><rect class="bar" x="${X0}" y="212" width="${kb(R.kb)}" height="22" rx="3" fill="currentColor"/><text x="${X0+kb(R.kb)+8}" y="228" font-size="12.5" fill="currentColor">${R.kb} B</text></g>
      ${small(40,260,"table, 32-bit input")}<g class="c-warn"><rect class="bar" x="${X0}" y="244" width="${kb(16*2**30)}" height="22" rx="3" fill="currentColor"/><text x="${X0+kb(16*2**30)-8}" y="260" text-anchor="end" font-size="12.5" fill="var(--panel)" font-weight="700">16 GiB</text></g>
      ${small(40,292,"DCF, 32-bit input")}<g class="c-ok"><rect class="bar" x="${X0}" y="276" width="${kb(R.kb32)}" height="22" rx="3" fill="currentColor"/><text x="${X0+kb(R.kb32)+8}" y="292" font-size="12.5" fill="currentColor">${R.kb32} B</text></g>`,
      "Bar charts: online rounds drop from 33 with secret-sharing comparison to 2 with FSS; DCF keys are hundreds of bytes where tables would be up to 16 GiB."); },
  play(){ growX(".bar",0,150); },
  math:()=>`<p>Rounds for secret sharing: ${R.ssRounds-2} for the ripple-carry sign, 1 for converting the bit, 1 for the select. FSS: 1 to open u, 1 for the select.</p><p>Key sizes computed from the engine: seed 16 B, per level 16 + 4 + 1 B, final word 4 B.</p>`,
  explain:()=>`<p>FSS turns a deep interactive comparison into one opening plus local work, at the cost of a trusted dealer, or an expensive two-party key generation, producing correlated keys offline.</p>
<p>This trade-off suits GPUs: online work is many independent PRG evaluations. SIGMA (Gupta et al., PETS 2024, <a href="https://eprint.iacr.org/2023/1269">ePrint 2023/1269</a>) reports secure inference for GPT-style models with up to 13 billion parameters using GPU FSS. See the paper for exact timings and the network assumptions behind them.</p>` }
];
const cfg={ id:"fss", title:"Function Secret Sharing Step by Step", compute,
  inputNote:"x is rounded to one decimal; 40·z must stay between −32 and 31 for the 6-bit comparison.", reseedLabel:"New keys and mask",
  status:{budgetLabel:"Online rounds", budgetCells:4, scaleLabel:"Working in", errLabel:"Error"},
  footer:'Real toy FSS: naive table keys and the BCG+21 distributed comparison function on 6-bit inputs with a SHA-256 PRG, outputs in Z<sub>2³²</sub>, plus a Beaver product. Schemes: Boyle, Gilboa, Ishai, <a href="https://doi.org/10.1007/978-3-662-46803-6_12">EUROCRYPT 2015</a>; Boyle et al., <a href="https://eprint.iacr.org/2020/1392">EUROCRYPT 2021</a>; SIGMA, <a href="https://eprint.iacr.org/2023/1269">PETS 2024</a>.',
  cardResult:()=>`${f(R.yv)} exactly (true ${f(R.relu)}), 2 online rounds`,
  steps };
steps.push(LS.cardStep(cfg,{name:"Function secret sharing",budget:"2 rounds",err:()=>"exact",
  explain:()=>`<p>FSS keeps the exactness and information-theoretic flavour of secret sharing for linear layers and makes comparisons nearly non-interactive, by moving work into dealer-generated keys. It needs two non-colluding servers plus a source of correlated randomness.</p>`}));
LS.start(cfg);
})();
