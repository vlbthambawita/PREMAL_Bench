<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secret Sharing Step by Step</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson.css">
</head>
<body>
<div id="app"></div>
<script src="lessons.js"></script>
<script src="cards/secret-sharing.js"></script>
<script src="lesson.js"></script>
<script src="engines/mpc.js"></script>
<script>
(function(){
"use strict";
const {svg,tile,lbl,small,pop,fade,draw,slide,blink,growX,f,fe,big}=LS;
const M=MPC, h8=v=>(v>>>0).toString(16).padStart(8,"0"), sg=M.signed;
let R;
function compute(inp){
  M.reset();
  const X=[Math.round(inp.x1*10),Math.round(inp.x2*10)], WT=[2,-1], BT=4;
  const zt=X[0]*WT[0]+X[1]*WT[1]+BT;
  const sx=X.map(M.share), sw=WT.map(M.share), sb=M.share(BT);
  const r0=M.rounds;
  const mm=M.mulMany([[sx[0],sw[0]],[sx[1],sw[1]]],"x·w");
  const rMul=M.rounds;
  const zs=[0,1].map(i=>M.add(M.add(mm.out[0][i],mm.out[1][i]),sb[i]));
  const a2b=M.a2bSign(zs);
  const rCmp=M.rounds;
  const sa=M.b2a(a2b.s), one=[M.sub(1,sa[0]),M.neg(sa[1])];
  const fin=M.mulMany([[zs,one]],"z·(1−s)");
  const rRelu=M.rounds;
  const y=sg(M.open(fin.out[0]));
  // ABY3 replicated track
  const rx=X.map(M.rep), rw=WT.map(M.rep);
  const p1=M.repMul(rx[0],rw[0]), p2=M.repMul(rx[1],rw[1]);
  const rz=M.repAddConst(M.repAdd(p1.out,p2.out),BT);
  R={X,WT,BT,zt,x:[inp.x1,inp.x2],sx,sw,sb,mm,zs,a2b,sign:a2b.s[0]^a2b.s[1],sa,one,fin,y,yv:y/40,
     relu:Math.max(0,zt)/40, rounds:{share:r0,mul:rMul,cmp:rCmp,relu:rRelu}, msgs:M.msgs,
     rx,rw,p1,p2,rz,rzv:sg(M.repOpen(rz))};
  return R;
}
const rd=n=>n===1?"1 round":`${n} rounds`;
/* recurring party layout */
const P0C="c-ok", P1C="c-muted";
const box=(x,y,w,h,cls,title,sub)=>`<g class="${cls}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9" fill="currentColor" fill-opacity=".07" stroke="currentColor" stroke-width="2"/><text x="${x+12}" y="${y+22}" font-size="13" font-weight="700" fill="currentColor">${title}</text>${sub?`<text x="${x+12}" y="${y+40}" font-size="11.5" fill="currentColor" class="c-muted">${sub}</text>`:""}</g>`;
const legendSS=y=>`<g class="c-ok"><rect x="20" y="${y}" width="10" height="10" rx="2" fill="currentColor"/></g>${small(36,y+9,"server P0")}<g class="c-muted"><rect x="110" y="${y}" width="10" height="10" rx="2" fill="currentColor"/></g>${small(126,y+9,"server P1 (non-colluding)")}`;
const mk=(cls)=>cls==="c-ok"?"ahk":cls==="c-muted"?"ahm":cls==="c-client"?"ahc":cls==="c-server"?"ahs":"ahn";
const arr=(x1,y1,x2,y2,cls,label,lx,ly,anchor="middle")=>`<g class="${cls} msg"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-width="2" marker-end="url(#${mk(cls)})"/>${label?`<text x="${lx}" y="${ly}" font-size="12" text-anchor="${anchor}" fill="currentColor">${label}</text>`:""}</g>`;

const steps=[
{ key:"Example", who:"both", whoT:"the task", at:0, budget:"0 rounds", scale:"×10, ×4, ×40", err:()=>"exact",
  title:"One neuron, split across two servers",
  cap:()=>`The client and the model owner split their numbers into random shares for two servers. As integers: 40·z = 15·2 + 20·(−1) + 4 = <b>${R.zt}</b>.`,
  scene(){ return svg(360,`
    ${box(20,30,170,110,"c-client","Client","holds x = ["+R.X.join(", ")+"]")}
    ${box(20,210,170,110,"c-server","Model owner","holds w = [2, −1], b = 4")}
    ${box(320,30,180,110,P0C,"Server P0","sees only random shares")}
    ${box(320,210,180,110,P1C,"Server P1","sees only random shares")}
    ${box(610,120,170,110,"c-noise","Dealer","offline: random triples")}
    ${arr(192,70,316,70,"c-client","shares of x",254,62)}
    ${arr(192,92,316,236,"c-client","",0,0)}
    ${arr(192,268,316,268,"c-server","shares of w, b",254,290)}
    ${arr(192,246,316,108,"c-server","",0,0)}
    ${arr(606,150,504,96,"c-noise","triples",570,112)}
    ${arr(606,200,504,254,"c-noise","",0,0)}
    <g class="c-ok msg"><line x1="390" y1="144" x2="390" y2="204" stroke="currentColor" stroke-width="2" marker-end="url(#ahk)"/></g>
    <g class="c-muted msg"><line x1="430" y1="206" x2="430" y2="146" stroke="currentColor" stroke-width="2" marker-end="url(#ahm)"/></g>
    ${small(440,180,"opened masked values")}
    ${legendSS(338)}`,"Client and model owner send random shares to two servers; a dealer supplies random triples; the servers exchange masked values."); },
  play(){ pop("g.c-client,g.c-server,g.c-ok,g.c-muted,g.c-noise",0,70); fade(".msg",600,120); },
  math:()=>`<div class="formula">integer encoding: x × 10 = [${R.X.join(", ")}], w × 4 = [2, −1], b × 40 = 4</div><div class="formula">40·z = ${R.X[0]}·2 + ${R.X[1]}·(−1) + 4 = ${R.zt}   so   z = ${R.zt}/40 = ${f(R.zt/40)}</div><p>All arithmetic below is modulo 2³². Negative numbers wrap around, so −1 is stored as ffffffff.</p>`,
  explain:()=>`<p>Secret sharing replaces encryption by splitting. Each secret number is cut into two random-looking pieces, one per server. Either piece alone is a uniformly random 32-bit number and says nothing. Only their sum reveals the secret.</p>
<p>The price is a different trust model. The two servers must not collude, and they must talk to each other during the computation. This is the setting of 2PC frameworks such as CrypTen, SecretFlow-SPU and MP-SPDZ, which run systems like MPCFormer, PUMA and SecFormer.</p>
<p>We use integers because shares live in the ring of 32-bit numbers. Scaling x by 10, w by 4 and b by 40 makes our neuron exact: 40·z = 14, so z = 0.35. Real systems use fixed point with about 12 to 16 fractional bits and truncate after each multiplication.</p>
<p>The dealer is a stand-in for an offline phase. It hands out random multiplication triples before any input arrives. SPDZ generates them with somewhat homomorphic encryption instead of a trusted dealer.</p>` },
{ key:"Share", who:"client", whoT:"client + owner", at:0.5, budget:"0 rounds", scale:"mod 2³²", err:()=>"exact",
  title:"Split every number into two random shares",
  cap:()=>`x₁ = ${R.X[0]} becomes ${h8(R.sx[0][0])} for P0 and ${h8(R.sx[0][1])} for P1. Each looks random. Their sum mod 2³² is ${R.X[0]}.`,
  scene(){ const s0=R.sx[0][0], s1=R.sx[0][1], X0=60, X1=740, px=v=>X0+(v/4294967296)*(X1-X0);
    const rows=[["x₁",R.sx[0]],["x₂",R.sx[1]],["w₁",R.sw[0]],["w₂",R.sw[1]],["b",R.sb]];
    return svg(360,`
      ${lbl(40,34,"The 32-bit ring as a line from 0 to 2³² (it wraps around)","font-weight=\"700\"")}
      <line x1="${X0}" y1="80" x2="${X1}" y2="80" stroke="currentColor" opacity=".4" stroke-width="2"/>
      ${small(X0,104,"0",'text-anchor="middle"')}${small(X1,104,"2³²",'text-anchor="middle"')}
      <g class="${P0C} pt"><circle cx="${px(s0)}" cy="80" r="7" fill="currentColor"/><text x="${px(s0)}" y="62" text-anchor="middle" font-size="12" fill="currentColor" class="mono">P0: ${h8(s0)}</text></g>
      <g class="${P1C} pt"><circle cx="${px(s1)}" cy="80" r="7" fill="currentColor"/><text x="${px(s1)}" y="${Math.abs(px(s1)-px(s0))<130?118:62}" text-anchor="middle" font-size="12" fill="currentColor" class="mono">P1: ${h8(s1)}</text></g>
      <g class="c-client pt"><circle cx="${px(R.X[0])}" cy="80" r="6" fill="none" stroke="currentColor" stroke-width="2.5"/></g>${small(px(R.X[0])+10,138,"sum = "+R.X[0]+" (wraps past 2³²)")}
      ${lbl(40,176,"All shares","font-weight=\"700\"")}
      <g class="${P0C}"><text x="200" y="176" font-size="12" font-weight="700" fill="currentColor">P0 holds</text></g><g class="${P1C}"><text x="360" y="176" font-size="12" font-weight="700" fill="currentColor">P1 holds</text></g>${small(520,176,"sum mod 2³² (nobody computes this)")}
      ${rows.map(([n,sh],i)=>`<g class="row">${lbl(60,204+i*30,n)}<g class="${P0C}"><text x="200" y="${204+i*30}" class="mono" font-size="13" fill="currentColor">${h8(sh[0])}</text></g><g class="${P1C}"><text x="360" y="${204+i*30}" class="mono" font-size="13" fill="currentColor">${h8(sh[1])}</text></g><text x="520" y="${204+i*30}" class="mono" font-size="13" fill="currentColor">${sg(M.open(sh))}</text></g>`).join("")}`,
      "The two shares of x1 are random points on the 32-bit ring whose sum wraps around to 15; a table lists every share held by P0 and P1."); },
  play(){ pop(".pt",0,200); fade(".row",700,90); },
  math:()=>`<div class="formula">pick s₀ uniformly in [0, 2³²),  s₁ = x − s₀ mod 2³²</div><div class="formula">x₁: ${h8(R.sx[0][0])} + ${h8(R.sx[0][1])} = ${h8(M.open(R.sx[0]))} (hex) = ${R.X[0]}</div><p>Because s₀ is uniform, s₁ is uniform too, whatever x is. This is information-theoretic security: no amount of computing power helps a single server.</p>`,
  explain:()=>`<p>Additive sharing is the simplest secret sharing there is. Pick one share at random and set the other so that the two add up to the secret, modulo 2³².</p>
<p>Each server sees one uniformly random number. That number would look exactly the same for any secret, so a single server learns nothing, even with unlimited computing power. There is no hardness assumption here and no noise, unlike every FHE scheme in this series.</p>
<p>Linear operations need no communication. To add two shared numbers, each server adds its own shares. To multiply by a public constant, each multiplies its share. Multiplying two shared numbers is the hard part, and it is the next step.</p>` },
{ key:"Triples", who:"both", whoT:"dealer", at:0.5, budget:"0 rounds", scale:"mod 2³²", err:()=>"exact",
  title:"Offline: the dealer hands out Beaver triples",
  cap:()=>`Before any input arrives, the dealer makes random a, b and c = a·b, and shares all three. One triple pays for one multiplication.`,
  scene(){ const t=R.mm.rec[0].t; const row=(y,n,v,sh)=>`<g class="trow">${lbl(330,y,n,'font-weight="700"')}<g class="c-noise"><text x="380" y="${y}" class="mono" font-size="13" fill="currentColor">${h8(v)}</text></g><g class="${P0C}"><text x="520" y="${y}" class="mono" font-size="13" fill="currentColor">${h8(sh[0])}</text></g><g class="${P1C}"><text x="650" y="${y}" class="mono" font-size="13" fill="currentColor">${h8(sh[1])}</text></g></g>`;
    return svg(300,`
      ${box(20,40,230,200,"c-noise","Dealer (offline)","random a, b; c = a·b mod 2³²")}
      <g class="c-noise dice"><rect x="60" y="100" width="44" height="44" rx="8" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="72" cy="112" r="4" fill="currentColor"/><circle cx="92" cy="132" r="4" fill="currentColor"/><circle cx="82" cy="122" r="4" fill="currentColor"/>
      <rect x="130" y="100" width="44" height="44" rx="8" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="142" cy="112" r="4" fill="currentColor"/><circle cx="162" cy="132" r="4" fill="currentColor"/></g>
      ${small(40,190,"one triple per multiplication;")}${small(40,206,"SPDZ makes them with BGV")}
      ${small(380,50,"value (secret)")}<g class="${P0C}"><text x="520" y="50" font-size="12" font-weight="700" fill="currentColor">share to P0</text></g><g class="${P1C}"><text x="650" y="50" font-size="12" font-weight="700" fill="currentColor">share to P1</text></g>
      ${row(90,"a",t.plain.a,t.a)}${row(130,"b",t.plain.b,t.b)}${row(170,"c",t.plain.c,t.c)}
      ${small(330,214,"check: a·b mod 2³² = "+h8(M.mul(t.plain.a,t.plain.b))+" = c")}
      ${arr(254,140,320,140,"c-noise","",0,0)}
      ${small(330,262,"the triple is independent of x and w, so it can be prepared long before the query")}`,
      "The dealer generates a random multiplication triple and splits a, b and c into shares for P0 and P1."); },
  play(){ A_dice(); fade(".trow",500,200); },
  math:()=>{ const t=R.mm.rec[0].t; return `<div class="formula">a = ${h8(t.plain.a)}, b = ${h8(t.plain.b)}, c = a·b mod 2³² = ${h8(t.plain.c)}</div><p>Two products (x₁·w₁ and x₂·w₂) need two triples. The comparison later needs one tiny triple on bits for every AND gate.</p>`; },
  explain:()=>`<p>A Beaver triple is a random multiplication that has already been done: shares of a, of b, and of their product c. It contains no information about the real inputs.</p>
<p>The trick, due to Beaver (1991), is that a shared multiplication of x by y can be turned into a public correction of this precomputed product. The servers only reveal x − a and y − b, which are masked by the random a and b.</p>
<p>Real systems produce triples in an offline phase. SPDZ uses somewhat homomorphic encryption between the servers, and silent OT or VOLE generators produce millions per second. A trusted dealer is the simplest way to show the idea.</p>` },
{ key:"× w", who:"server", whoT:"two servers", at:1, budget:()=>rd(R.rounds.mul), scale:"mod 2³²", err:()=>"exact",
  title:"Multiply shares with one round of messages",
  cap:()=>`Each server reveals d = x − a and e = w − b. Both look random. Then each computes its share of x·w locally. Both products share one round.`,
  scene(){ const r=R.mm.rec[0]; const t=r.t;
    return svg(340,`
      ${box(20,30,250,270,P0C,"Server P0","x₁, w₁, a, b, c shares")}
      ${box(530,30,250,270,P1C,"Server P1","x₁, w₁, a, b, c shares")}
      <g class="${P0C} msg"><line x1="274" y1="96" x2="524" y2="96" stroke="currentColor" stroke-width="2" marker-end="url(#ahk)"/><text x="400" y="88" text-anchor="middle" font-size="12" fill="currentColor" class="mono">d₀ = ${h8(M.sub(R.sx[0][0],t.a[0]))}, e₀ = ${h8(M.sub(R.sw[0][0],t.b[0]))}</text></g>
      <g class="${P1C} msg"><line x1="526" y1="134" x2="276" y2="134" stroke="currentColor" stroke-width="2" marker-end="url(#ahm)"/><text x="400" y="156" text-anchor="middle" font-size="12" fill="currentColor" class="mono">d₁ = ${h8(M.sub(R.sx[0][1],t.a[1]))}, e₁ = ${h8(M.sub(R.sw[0][1],t.b[1]))}</text></g>
      <g class="open">${tile(300,180,200,40,"d = x₁ − a = "+h8(r.d),"c-noise","",12)}${tile(300,228,200,40,"e = w₁ − b = "+h8(r.e),"c-noise","",12)}</g>
      ${small(400,290,"public, but masked by random a and b",'text-anchor="middle"')}
      <g class="${P0C} loc">${lbl(40,200,"z₀ = c₀ + d·b₀ + e·a₀ + d·e","class=\"mono\" font-size=\"12\"")}<text x="40" y="226" class="mono" font-size="13" fill="currentColor">= ${h8(r.z[0])}</text></g>
      <g class="${P1C} loc">${lbl(550,200,"z₁ = c₁ + d·b₁ + e·a₁","class=\"mono\" font-size=\"12\"")}<text x="550" y="226" class="mono" font-size="13" fill="currentColor">= ${h8(r.z[1])}</text></g>
      ${small(40,262,"z₀ + z₁ = "+sg(M.open(r.z))+" = x₁·w₁")}`,
      "P0 and P1 exchange masked differences d and e in one round, then each computes its share of the product locally."); },
  play(){ pop("g.c-ok,g.c-muted",0,0); slide(".msg",-40,0,300,300); pop(".open",1000,150); fade(".loc",1500,200); },
  math:()=>{ const r=R.mm.rec[0], r2=R.mm.rec[1]; return `<div class="formula">x·w = (d + a)(e + b) = c + d·b + e·a + d·e</div><table class="nums"><thead><tr><th>product</th><th>d (opened)</th><th>e (opened)</th><th>P0 share</th><th>P1 share</th><th>sum</th></tr></thead><tbody>
    <tr><td>x₁·w₁</td><td class="v">${h8(r.d)}</td><td class="v">${h8(r.e)}</td><td class="v">${h8(r.z[0])}</td><td class="v">${h8(r.z[1])}</td><td class="v">${sg(M.open(r.z))}</td></tr>
    <tr><td>x₂·w₂</td><td class="v">${h8(r2.d)}</td><td class="v">${h8(r2.e)}</td><td class="v">${h8(r2.z[0])}</td><td class="v">${h8(r2.z[1])}</td><td class="v">${sg(M.open(r2.z))}</td></tr></tbody></table>`; },
  explain:()=>`<p>Write x = d + a and w = e + b. Multiplying out gives x·w = c + d·b + e·a + d·e. The servers already hold shares of a, b and c, and d and e are public, so every term can be computed share by share. Only P0 adds the public d·e.</p>
<p>Revealing d and e is safe because a and b are fresh random numbers used only once. To the other server, d and e look exactly like random noise.</p>
<p>This costs one round of communication, but any number of independent products can share it. In an LLM, a whole matrix product is done in one round with one triple per product or with matrix triples. The servers' bandwidth, not their arithmetic, usually limits MPC inference.</p>` },
{ key:"Add b", who:"server", whoT:"two servers", at:1, budget:()=>rd(R.rounds.mul), scale:"mod 2³²", err:()=>"exact",
  title:"Additions are free: shares of z",
  cap:()=>`Each server adds its two product shares and its bias share. Now P0 holds ${h8(R.zs[0])} and P1 holds ${h8(R.zs[1])}. Nobody has seen z.`,
  scene(){ const c=(x,cls,a,b,bb,z)=>`<g class="${cls} col"><text x="${x}" y="60" class="mono" font-size="13" fill="currentColor">${h8(a)}</text><text x="${x}" y="90" class="mono" font-size="13" fill="currentColor">+ ${h8(b)}</text><text x="${x}" y="120" class="mono" font-size="13" fill="currentColor">+ ${h8(bb)}</text><line x1="${x-4}" y1="132" x2="${x+150}" y2="132" stroke="currentColor"/><text x="${x}" y="156" class="mono" font-size="14" font-weight="700" fill="currentColor">= ${h8(z)}</text></g>`;
    return svg(300,`
      ${small(40,60,"x₁·w₁ share")}${small(40,90,"x₂·w₂ share")}${small(40,120,"b share")}${small(40,156,"z share")}
      <g class="${P0C}"><text x="200" y="30" font-size="13" font-weight="700" fill="currentColor">Server P0</text></g><g class="${P1C}"><text x="420" y="30" font-size="13" font-weight="700" fill="currentColor">Server P1</text></g>
      ${c(200,P0C,R.mm.out[0][0],R.mm.out[1][0],R.sb[0],R.zs[0])}${c(420,P1C,R.mm.out[0][1],R.mm.out[1][1],R.sb[1],R.zs[1])}
      <g class="c-muted"><rect x="620" y="40" width="160" height="130" rx="8" fill="none" stroke="currentColor" stroke-dasharray="5 4"/></g>
      ${small(632,62,"teacher's view only")}${small(632,82,"z₀ + z₁ mod 2³²")}
      <g class="c-ok tv"><text x="700" y="128" text-anchor="middle" font-size="30" class="mono" fill="currentColor">${sg(M.open(R.zs))}</text></g>${small(700,154,"= 40·z",'text-anchor="middle"')}
      ${small(40,220,"No messages: adding shares needs no communication, and neither does multiplying by a public number.")}`,
      "Each server adds its own shares of the two products and the bias; the shares of z still look random and sum to 14."); },
  play(){ fade(".col",0,300); pop(".tv",900); },
  math:()=>`<div class="formula">z₀ = ${h8(R.mm.out[0][0])} + ${h8(R.mm.out[1][0])} + ${h8(R.sb[0])} = ${h8(R.zs[0])}</div><div class="formula">z₁ = ${h8(R.mm.out[0][1])} + ${h8(R.mm.out[1][1])} + ${h8(R.sb[1])} = ${h8(R.zs[1])}</div><div class="formula">z₀ + z₁ = ${sg(M.open(R.zs))} = 40·z</div>`,
  explain:()=>`<p>Sharing is linear: the sum of shares is a share of the sum. So the bias costs nothing, and neither would any number of further additions.</p>
<p>Compare CKKS: there, additions were also cheap, but the multiplication cost a level of the modulus. Here multiplication costs a message round instead, and there is no budget that runs out. A secret-shared circuit can be as deep as you like, as long as you are willing to wait for the rounds.</p>
<p>The dashed box is a teaching aid. In the real protocol nobody ever adds z₀ and z₁. That is exactly what the next step has to work around.</p>` },
{ key:"Compare", who:"server", whoT:"two servers", at:1, budget:()=>rd(R.rounds.cmp), scale:"bits", err:()=>"exact",
  title:"ReLU needs the sign bit: add the shares bit by bit",
  cap:()=>`The sign of z is bit 31 of z₀ + z₁. The servers add their shares with a ripple-carry adder on secret bits. Each carry needs one AND, which costs one round: ${R.rounds.cmp-R.rounds.mul} rounds.`,
  scene(){ const tr=R.a2b.trace, W=22, X0=60, col=i=>X0+(31-i)*W;
    const cell=(i,y,v,cls,extra="")=>`<g class="${cls} ${extra}"><rect x="${col(i)}" y="${y}" width="${W-3}" height="22" rx="3" fill="currentColor" fill-opacity="${v?.55:.08}" stroke="currentColor" stroke-width="1"/><text x="${col(i)+(W-3)/2}" y="${y+16}" text-anchor="middle" font-size="11" class="mono" fill="currentColor">${v}</text></g>`;
    let g="";
    tr.forEach(t=>{ g+=cell(t.i,60,t.a,P0C)+cell(t.i,92,t.b,P1C)+cell(t.i,140,t.carry,"c-noise","carry")+cell(t.i,188,t.sum,t.i===31?"c-warn":"c-client","sum"); });
    return svg(300,`
      ${small(X0,40,"bit 31 (sign)")}${small(col(0)+W-3,40,"bit 0",'text-anchor="end"')}
      ${small(10,76,"P0")}${small(10,108,"P1")}${small(10,156,"carry")}${small(10,204,"sum")}
      ${g}
      <g class="c-warn"><rect x="${col(31)-4}" y="${184}" width="${W+5}" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="${col(31)}" y="236" font-size="12.5" fill="currentColor">sign bit = ${R.sign} → z ${R.sign?"&lt; 0":"≥ 0"}</text></g>
      ${small(X0,126,"bits of each server's own share (each server knows only its own row)")}
      ${small(X0,272,"carries and sums exist only as XOR shares; shown here in the clear for teaching. The carry ripples from bit 0 leftwards: 31 sequential AND gates.")}`,
      "A 32-column grid shows the bits of each share, the rippling carry chain and the sum; the leftmost sum bit is the sign of z."); },
  play(){ fade(".carry",0,40); fade(".sum",200,40); blink("g.c-warn",1600); },
  math:()=>`<div class="formula">carryᵢ₊₁ = carryᵢ ⊕ ((aᵢ ⊕ carryᵢ) ∧ (bᵢ ⊕ carryᵢ))     sumᵢ = aᵢ ⊕ bᵢ ⊕ carryᵢ</div><p>Every ∧ is a boolean Beaver multiplication on XOR-shared bits: one round each. Rounds so far: ${R.rounds.mul} for the products + ${R.rounds.cmp-R.rounds.mul} for the adder = ${R.rounds.cmp}. Messages so far: ${R.rounds.cmp*2} in each direction.</p>`,
  explain:()=>`<p>ReLU asks a question shares cannot answer locally: is z negative? Negative numbers in 32-bit two's complement have the top bit set, so the servers need the top bit of z₀ + z₁, including every carry from below.</p>
<p>Each server first reads its own share as 32 bits, which are already XOR shares of the inputs to an adder. Sum bits are XORs, which are free. Carry bits need ANDs, and each AND of shared bits is a boolean Beaver multiplication, which costs one round.</p>
<p>A ripple-carry adder is the most sequential choice: the carry for bit i needs the carry for bit i − 1, so 31 rounds follow one after another. Parallel-prefix adders cut this to about log₂ 32 = 5 rounds at the price of more AND gates. Protocols such as CrypTFlow2, Cheetah and SIRNN use oblivious transfer instead, and function secret sharing (lesson 19) does the whole comparison in one round.</p>` },
{ key:"ReLU", who:"server", whoT:"two servers", at:1, budget:()=>rd(R.rounds.relu), scale:"mod 2³²", err:()=>"exact",
  title:"Select: y = z · (1 − sign)",
  cap:()=>`Turn the shared sign bit back into arithmetic shares (one round), then multiply z by 1 − sign (one more round). Total: ${R.rounds.relu} rounds.`,
  scene(){ const node=(x,w,t,sub,cls)=>`<g class="${cls} pipe"><rect x="${x}" y="30" width="${w}" height="70" rx="8" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2"/><text x="${x+w/2}" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">${t}</text><text x="${x+w/2}" y="82" text-anchor="middle" font-size="11.5" fill="currentColor" class="mono">${sub}</text></g>`;
    return svg(250,`
      ${node(20,150,"sign bit","XOR shares "+R.a2b.s[0]+" ⊕ "+R.a2b.s[1],"c-warn")}
      ${node(220,160,"bit → number","s₀ + s₁ − 2·s₀·s₁","c-server")}
      ${node(430,160,"1 − sign","shares of "+(1-R.sign),"c-server")}
      ${node(640,140,"× z","Beaver, 1 round","c-server")}
      ${LS.arrow(172,65,214,65,"ahs","c-server")}${LS.arrow(382,65,424,65,"ahs","c-server")}${LS.arrow(592,65,634,65,"ahs","c-server")}
      ${small(300,120,"+1 round",'text-anchor="middle"')}${small(710,120,"+1 round",'text-anchor="middle"')}
      <g class="${P0C}"><text x="200" y="170" font-size="13" fill="currentColor">P0: y₀ = <tspan class="mono">${h8(R.fin.out[0][0])}</tspan></text></g>
      <g class="${P1C}"><text x="200" y="200" font-size="13" fill="currentColor">P1: y₁ = <tspan class="mono">${h8(R.fin.out[0][1])}</tspan></text></g>
      ${small(200,230,"still random-looking; they add up to ReLU("+sg(M.open(R.zs))+") = "+R.y)}`,
      "The shared sign bit is converted to arithmetic shares, subtracted from one and multiplied with z, giving shares of y."); },
  play(){ slide(".pipe",-30,0,0,250); fade("text",1100,0); },
  math:()=>`<div class="formula">s = s₀ ⊕ s₁ = s₀ + s₁ − 2·s₀·s₁ = ${R.sign}</div><div class="formula">y = z · (1 − s) = ${sg(M.open(R.zs))} · ${1-R.sign} = ${R.y}</div><p>Rounds: products 1, adder ${R.rounds.cmp-R.rounds.mul}, bit-to-number 1, select 1 → ${R.rounds.relu}. Messages exchanged: ${R.msgs}.</p>`,
  explain:()=>`<p>The adder produced the sign as XOR shares of a single bit. To use it in ordinary arithmetic, the servers convert it: for bits, s₀ ⊕ s₁ = s₀ + s₁ − 2·s₀·s₁, and the product s₀·s₁ is one more Beaver multiplication.</p>
<p>ReLU is then a multiplexer: keep z if the sign is 0, output 0 if it is 1. That is z·(1 − sign), a final Beaver multiplication.</p>
<p>Notice what happened to the error. There is none. The result is exactly 14, because secret sharing computes exact integer arithmetic and the comparison is a real comparison, not a polynomial imitation. What ReLU cost here is communication: ${R.rounds.relu - R.rounds.mul} of the ${R.rounds.relu} rounds went into one comparison.</p>` },
{ key:"Open", who:"client", whoT:"client", at:0, budget:()=>rd(R.rounds.relu)+" + output", scale:"÷ 40", err:()=>Math.abs(R.yv-R.relu)||"exact",
  title:"Only the client adds the output shares",
  cap:()=>`Both servers send their y shares to the client, which adds them: <b>${R.y}</b>, so y = ${R.y}/40 = <b>${f(R.yv)}</b>, exactly the true ReLU.`,
  scene(){ const cmp=[["CKKS (lesson 1)",1,"c-client"],["secret sharing, this lesson",R.rounds.relu+1,"c-server"]], W0=260,W1=760, mx=Math.max(...cmp.map(c=>c[1]));
    return svg(320,`
      ${box(20,30,200,120,P0C,"Server P0","sends y₀")}${box(20,170,200,120,P1C,"Server P1","sends y₁")}
      ${box(560,90,220,140,"c-client","Client","y₀ + y₁ mod 2³²")}
      ${arr(224,90,556,140,P0C,h8(R.fin.out[0][0]),390,104)}${arr(224,230,556,180,P1C,h8(R.fin.out[0][1]),390,226)}
      <g class="c-client big"><text x="670" y="186" text-anchor="middle" font-size="32" class="mono" fill="currentColor">${R.y}</text><text x="670" y="214" text-anchor="middle" font-size="13" fill="currentColor">÷ 40 = ${f(R.yv)}</text></g>
      ${small(250,300,"round trips for the whole neuron:  CKKS 1  ·  secret sharing "+(R.rounds.relu+1)+" (client ↔ servers and server ↔ server)")}`,
      "Each server sends its output share to the client, which adds them to get 14 and divides by 40 to get 0.35."); },
  play(){ slide(".msg",-60,0,0,250); pop(".big",900); },
  math:()=>`<div class="formula">y = ${h8(R.fin.out[0][0])} + ${h8(R.fin.out[0][1])} mod 2³² = ${R.y}  →  ${R.y}/40 = ${f(R.yv)}</div><p>True ReLU(z) = ${f(R.relu)}. Error: ${Math.abs(R.yv-R.relu)<1e-12?"none":fe(Math.abs(R.yv-R.relu))}.</p>`,
  explain:()=>`<p>The output is revealed only to the client, by sending it the two output shares. The servers never learn y.</p>
<p>The answer is exact. Compare the three error sources seen so far: CKKS had small encryption noise and a large ReLU approximation error; secret sharing has neither. Its costs are elsewhere: ${R.rounds.relu} rounds of server-to-server messages for one neuron, and the assumption that the two servers never pool their shares.</p>
<p>For a real LLM the round count grows with depth, not width, because all neurons in a layer share rounds. MPC frameworks such as PUMA run LLaMA-7B in minutes per token on fast networks, and their cost is dominated by communication volume for the non-linear layers.</p>` },
{ key:"ABY3", who:"server", whoT:"three servers", at:1, budget:"1 round per product", scale:"mod 2³²", err:()=>"exact",
  title:"Three servers: replicated sharing (ABY3)",
  cap:()=>`Split x into three shares; each server holds two of them. Products are local, then one message re-shares them. Reconstructed: <b>${R.rzv}</b> = 40·z.`,
  scene(){ const P=[[400,96],[170,286],[630,286]], names=["S1","S2","S3"], cls=["c-ok","c-muted","c-server"], s=R.rx[0];
    const ea=(i,j,off)=>{ const [x1,y1]=P[i],[x2,y2]=P[j], dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, nx=-uy*off, ny=ux*off; return `<path d="M ${(x1+ux*48+nx).toFixed(1)},${(y1+uy*48+ny).toFixed(1)} L ${(x2-ux*52+nx).toFixed(1)},${(y2-uy*52+ny).toFixed(1)}" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#ahn)"/>`; };
    let g=`<g class="c-noise reshare">${ea(1,0,0)}${ea(2,1,0)}${ea(0,2,0)}</g>`;
    P.forEach((p,i)=>{ g+=`<g class="${cls[i]} node"><circle cx="${p[0]}" cy="${p[1]}" r="40" fill="var(--panel)" stroke="currentColor" stroke-width="2"/><circle cx="${p[0]}" cy="${p[1]}" r="40" fill="currentColor" fill-opacity=".1"/><text x="${p[0]}" y="${p[1]+5}" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">${names[i]}</text></g>
      <text x="${p[0]}" y="${p[1]+(i===0?-54:64)}" text-anchor="middle" font-size="12" class="mono" fill="currentColor">holds (x${LS.sub(i+1)}, x${LS.sub((i+1)%3+1)}) = (${h8(s[i][0])}, ${h8(s[i][1])})</text>`; });
    g+=small(400,250,"after each product, server i+1 sends its local",'text-anchor="middle"')+small(400,268,"result to server i: one round, one value each",'text-anchor="middle"');
    return svg(380,g,"Three servers in a triangle each hold two of the three shares of x1 and pass one value to a neighbour after each multiplication."); },
  play(){ pop(".node",0,150); draw(".reshare path",600,700); },
  math:()=>{ const p=R.p1; return `<div class="formula">x₁ = x₁⁽¹⁾ + x₁⁽²⁾ + x₁⁽³⁾ = ${R.X[0]};   server i holds (xᵢ, xᵢ₊₁)</div><div class="formula">zᵢ = xᵢyᵢ + xᵢyᵢ₊₁ + xᵢ₊₁yᵢ + αᵢ,   α₁ + α₂ + α₃ = 0</div><table class="nums"><thead><tr><th>server</th><th>local zᵢ for x₁·w₁</th></tr></thead><tbody>${p.local.map((v,i)=>`<tr><td>S${i+1}</td><td class="v">${h8(v)}</td></tr>`).join("")}</tbody></table><p>z₁ + z₂ + z₃ = ${sg(M.repOpen(p.out))} = x₁·w₁. Adding x₂·w₂ and b gives ${R.rzv} = 40·z.</p>`; },
  explain:()=>`<p>With three servers and an honest majority, multiplication gets cheaper. Split x into three random shares and give each server two of them, in a ring. Any single server sees two random numbers and learns nothing, but any two servers together could reconstruct.</p>
<p>The product xy expands into nine cross terms, and each server can compute three of them from the shares it holds. Adding a random sharing of zero hides the local results, and one message to a neighbour restores the two-shares-each layout. No triples and no dealer are needed.</p>
<p>This is the setting of ABY3 and of PUMA, which ran LLaMA-7B in about five minutes per token. The comparison for ReLU still needs a boolean circuit, as in the previous steps, but each AND gate is now one local step plus one message.</p>` }
];
function A_dice(){ LS.A(".dice",[{transform:"rotate(-20deg) scale(.7)",opacity:0},{transform:"rotate(8deg)",opacity:1},{transform:"rotate(0)"}],{d:700}); }
const cfg={ id:"secret-sharing", title:"Secret Sharing Step by Step", compute,
  inputNote:"x is rounded to one decimal (x × 10 must be an integer). Every share and round is recomputed.",
  reseedLabel:"New random shares",
  status:{budgetLabel:"Rounds so far", budgetCells:4, scaleLabel:"Arithmetic", errLabel:"Error"},
  footer:'Real 2-out-of-2 additive sharing mod 2³² with dealer-generated Beaver triples, a ripple-carry comparison on XOR-shared bits, and ABY3-style replicated sharing. Schemes: Damgård, Pastro, Smart, Zakarias, <a href="https://eprint.iacr.org/2011/535">CRYPTO 2012 (SPDZ)</a>; Mohassel, Rindal, <a href="https://eprint.iacr.org/2018/403">CCS 2018 (ABY3)</a>.',
  cardResult:()=>`${f(R.yv)} exactly (true ${f(R.relu)}), after ${R.rounds.relu} rounds`,
  steps };
steps.push(LS.cardStep(cfg,{name:"Secret sharing",budget:()=>rd(R.rounds.relu),err:()=>"exact",
  explain:()=>`<p>Secret sharing trades the heavy arithmetic of FHE for communication and a stronger trust assumption. Arithmetic is exact and noise-free, ReLU is a true comparison, and nothing runs out. Every multiplication and every comparison step costs a network round, and the servers must not collude.</p>`}));
LS.start(cfg);
})();
</script>
